name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 빌드와 시뮬레이션 테스트
        run: npm test
      - name: index.html이 src와 일치하는지 확인
        run: git diff --exit-code index.html
