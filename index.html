function crashTick(){if(!G.crash||!G.crash.length)return;const keep=[];
  for(const cr of G.crash){if(cr.t>G.time){keep.push(cr);continue;}if(FXH.crash)FXH.crash(cr);
    if(!cr.big){if(cr.kind==='fpv')for(const u of G.units)if(!UT[u.type].fly&&Math.hypot(u.x-cr.x,u.z-cr.z)<.45){u.supp=Math.max(u.supp||0,1);harm(u,1,null,{kind:'blast',x:cr.x,z:cr.z,rad:.3});}continue;}
    sfx('boom');const r=Math.floor(cr.z),c=Math.floor(cr.x);
    for(const u of G.units.slice())if(!UT[u.type].fly&&Math.hypot(u.x-cr.x,u.z-cr.z)<1){u.supp=2;harm(u,4,null,{kind:'blast',x:cr.x,z:cr.z,rad:.6});}
    if(inb(r,c)&&G.map[r][c].t==='bldg'){damageBldg(r,c,8);if(typeof ignite==='function')ignite(r,c,.4);}}
  G.crash=keep;bump();}

/* ---------- FPV·정찰드론: 전파 방해와 돌입 ---------- */
function jammedBy(u){for(const e of G.units){const r=UT[e.type].jam;if(!r||e.nat===u.nat)continue;if(Math.hypot(e.x-u.x,e.z-u.z)<=r)return e;}return null;}
function droneTick(u,dt){const t=UT[u.type];u.air=u.air||{born:G.time||0};
  const j=jammedBy(u);u.jam=j?1:0;
  if(j&&Math.random()<(t.kami?.5:.15)*dt){if(G.nats[j.nat]){G.nats[j.nat].kills++;j.kills=(j.kills||0)+1;}airDown(u,'jam');FXH.kill(u);airRemove(u);G.nats[u.nat].losses++;return false;}
  if(!t.kami)return true;
  // 드론팀이 띄운 FPV: 조종수가 쓰러지거나 10칸 밖으로 나가면 신호가 끊긴다
  if(u.op!=null){const op=G.units.find(z=>z.id===u.op);if(!op||Math.hypot(op.x-u.x,op.z-u.z)>DT_LINK){L(`${natName(u.nat)} FPV 조종 신호 끊김`);airDown(u);FXH.kill(u);airRemove(u);return false;}}
  if(G.time-u.air.born>FPV_LIFE){L(`${natName(u.nat)} FPV 드론 배터리 소진`);airDown(u);FXH.kill(u);airRemove(u);return false;}
  let e=u.tgt!=null?G.units.find(z=>z.id===u.tgt):null;if(e&&(UT[e.type].fly||(G.fog&&!seen(e,u.nat))))e=null;
  // 명령이 없으면 가까이 보이는 지상 적을 스스로 노린다(값진 표적 우선)
  if(!e&&!(u.path&&u.path.length)){let bs=0;for(const o of G.units){if(o.nat===u.nat||UT[o.type].fly||(G.fog&&!seen(o,u.nat)))continue;const d=Math.hypot(o.x-u.x,o.z-u.z);if(d>4.5)continue;const s=UT[o.type].cost/(1+d);if(s>bs){bs=s;e=o;}}if(e)u.tgt=e.id;}
  if(!e){u.air.dive=0;return true;}
  u.path=[];const dx=e.x-u.x,dz=e.z-u.z,d=Math.hypot(dx,dz);u.air.dive=d<1.3?1:0;u.air.dd=d;u.face=Math.atan2(dz,dx)*180/Math.PI;
  // 전파 방해 중에는 조종이 흔들려 비틀거린다
  const wob=u.jam?(Math.random()-.5)*.9:0;const sp=t.mv*SPD_K*(u.air.dive?1.25:1);const st=Math.min(d,sp*dt);
  u.x=Math.min(N-.01,Math.max(.01,u.x+dx/(d||1)*st+wob*dt));u.z=Math.min(N-.01,Math.max(.01,u.z+dz/(d||1)*st-wob*dt));rtCell(u);if(!G.units.includes(u))return false;
  if(d<=.32){fpvBoom(u,e);return false;}
  return false;}
/* 부딪혀 터짐: 표적에 큰 피해(위에서 덮치므로 장갑 무시, 건물 안이면 지붕·벽이 일부 막는다), 주변에 파편 */
function fpvBoom(u,e){const te=UT[e.type];const ins=cell(e.r,e.c).t==='bldg'&&!te.fly;
  let dmg=te.cls==='veh'?7:4.5;if(ins)dmg*=.45;dmg*=.85+Math.random()*.3;dmg=Math.round(dmg*10)/10;
  if(FXH.fpvBoom)FXH.fpvBoom(u,e);sfx('hit');airRemove(u);
  e.supp=Math.max(e.supp||0,1.5);G.nats[u.nat].dmg=(G.nats[u.nat].dmg||0)+dmg;
  if(ins)damageBldg(e.r,e.c,3);
  L(`${natName(u.nat)} FPV 드론이 ${natName(e.nat)} ${te.n} 타격`);
  harm(e,dmg,u,{kind:'blast',x:e.x,z:e.z,rad:.35});
  for(const o of G.units.slice())if(o!==e&&!UT[o.type].fly&&Math.hypot(o.x-e.x,o.z-e.z)<.6){o.supp=Math.max(o.supp||0,1);harm(o,1,u,{kind:'frag',x:e.x,z:e.z,rad:.4});}
  bump();}

/* ---------- 드론팀 ---------- */
const DT_LINK=10, DT_SETUP=3, DT_GAP=9, DT_RESUP=25;
function dteamTick(u,dt){if(u.dr==null){u.dr=4;u.dsT=0;u.lt=-99;u.rs=G.time;}
  if(u.dr<4&&G.time-u.rs>=DT_RESUP){u.dr++;u.rs=G.time;}else if(u.dr>=4)u.rs=G.time;
  if((u.path&&u.path.length)||u.climb){u.dsT=0;return;}u.dsT+=dt;
  if(u.dsT<DT_SETUP||u.dr<=0||G.time-u.lt<DT_GAP||u.supp>.8)return;
  if(G.units.filter(f=>f.op===u.id).length>=2)return;
  const own=G.units.filter(f=>f.op===u.id).map(f=>f.tgt);let best=null,bs=0;
  for(const e of G.units){if(e.nat===u.nat||UT[e.type].fly||(G.fog&&!seen(e,u.nat)))continue;const d=Math.hypot(e.x-u.x,e.z-u.z);if(d>DT_LINK-1)continue;
    const s=UT[e.type].cost*(UT[e.type].cls==='veh'?2:1)/(3+d)*(cell(e.r,e.c).t==='bldg'?.5:1)*(own.includes(e.id)?.3:1);if(s>bs){bs=s;best=e;}}
  if(!best)return;launchFpv(u,best);}
function launchFpv(u,e){const f=mkUnit(u.nat,'fpv',u.r,u.c);f.x=u.x;f.z=u.z;f.op=u.id;f.tgt=e?e.id:null;f.air={born:G.time};u.dr--;u.lt=G.time;u.firedT=G.time;
  if(FXH.launch)FXH.launch(u,f);sfx('launch',.5);L(`${natName(u.nat)} 드론팀 FPV 이륙`);bump();return f;}
/* 험비·장갑차에서 드론팀 하차 (차량마다 한 번, 지휘 3) */
const DISMOUNT_CP=3;
function canDismount(v){return v&&(v.type==='hmv'||v.type==='ifv')&&!v.dis&&G.nats[v.nat].cp>=DISMOUNT_CP;}
function dismount(v){if(!canDismount(v))return null;let spot=null,bd=9;
  for(let i=0;i<16;i++){const a=i/16*6.283;for(const R of [.45,.7,1]){const x=v.x+Math.cos(a)*R,z=v.z+Math.sin(a)*R;const t=tileAt(x,z);if(!t||t.t==='bldg'||t.t==='water')continue;if(R<bd){bd=R;spot=[x,z];}}}
  if(!spot)return null;G.nats[v.nat].cp-=DISMOUNT_CP;v.dis=1;const u=mkUnit(v.nat,'dteam',Math.floor(spot[1]),Math.floor(spot[0]));u.x=spot[0];u.z=spot[1];u.face=v.face;
  L(`${natName(v.nat)} ${UT[v.type].n}에서 드론팀 하차`);if(FXH.land)FXH.land(u);bump();return u;}

/* 매 틱: 날아다니는 것들 (rtTick에서 부대 처리 전에 부른다) */
function airTick(dt){if(!G)return;
  if(G.airq&&G.airq.length){const keep=[];for(const j of G.airq){if(j.t>G.time){keep.push(j);continue;}jetDrop(j);}G.airq=keep;}
  crashTick();
  for(const u of G.units.slice()){if(!G.units.includes(u))continue;const t=UT[u.type];if(!t.fly)continue;
    if(t.heli){gunshipTick(u,dt);continue;}droneTick(u,dt);}
  for(const u of G.units.slice())if(UT[u.type].dteam&&G.units.includes(u))dteamTick(u,dt);
  // AI: 적이 가까이 보이면 험비·장갑차가 드론팀을 내려놓는다
  for(const v of G.units.slice()){if(!canDismount(v)||!isAI(v.nat)||G.units.filter(o=>o.nat===v.nat).length>=unitCap())continue;if(Math.random()>dt*.15)continue;
    if(G.units.some(e=>e.nat!==v.nat&&!UT[e.type].fly&&Math.hypot(e.x-v.x,e.z-v.z)<8&&(!G.fog||seen(e,v.nat))))dismount(v);}}

/* ---------- AI ---------- */
// 증원 가중치: 적 차량이 보이면 FPV, 적 비행체가 보이면 대공, 적 FPV가 보이면 전자전팀
function aiAirW(E,cnt){const eVeh=E.filter(e=>UT[e.type].cls==='veh').length,eAir=E.filter(e=>UT[e.type].fly).length,eFpv=E.filter(e=>UT[e.type].kami).length;
  return {fpv:cnt('fpv')<3&&E.length?.2+eVeh*.6:0,dteam:cnt('dteam')<2?(E.length?.9+eVeh*.5:.3):0,aa:cnt('aa')<2?(eAir?1.6:.3):0,zu:cnt('zu')<1?(eAir?1.4:.2):0,ew:cnt('ew')<2?(eFpv?2.2:.25):0};}
// FPV: 보이는 적 중 값진 지상 표적(차량 우선)을 골라 돌입. 없으면 평소처럼 움직인다.
function aiFpv(n,u,E){if(u.tgt!=null&&G.units.some(e=>e.id===u.tgt))return true;let best=null,bs=0;
  for(const e of E){if(UT[e.type].fly)continue;const d=Math.hypot(e.x-u.x,e.z-u.z);if(d>14)continue;const s=UT[e.type].cost*(UT[e.type].cls==='veh'?2:1)/(3+d)*(cell(e.r,e.c).t==='bldg'?.5:1);if(s>bs){bs=s;best=e;}}
  if(best){u.tgt=best.id;u.path=[];return true;}return false;}
// 공격헬기: 적이 여럿 보이고 아군 헬기가 없을 때, 적이 가장 몰린 곳에
function aiAirSup(n,E){const N2=G.nats[n];if(N2.cp<SUP.gunship.cost+2||WX[G.wx].noAir||E.length<3)return false;if(G.units.some(u=>u.nat===n&&u.type==='gunship'))return false;
  const eAA=E.filter(e=>e.type==='aa'||e.type==='zu').length;if(eAA>=2&&Math.random()<.7)return false;
  let best=null,bs=0;for(const e of E){if(UT[e.type].fly)continue;let s=0;for(const o of E)if(Math.hypot(o.x-e.x,o.z-e.z)<3)s+=UT[o.type].cost;if(s>bs){bs=s;best=e;}}
  if(!best||bs<9)return false;return support(n,'gunship',best.r,best.c);}

/* ---- 05f-men.js ---- */
/* ===================== MEN: 분대 안의 병사 한 명 한 명 =====================
   분대(부대)는 여전히 한 점(u.x,u.z)으로 길을 찾고 싸운다. 그 점은 분대장이 가는 곳이다.
   병사들은 그 점에 묶인 고정 대형이 아니라 각자 자리를 정하고 따로 움직인다(u._men, 저장하지 않음).
   - 출발: 명령을 받으면 앞사람부터 차례로 몸을 일으켜 나간다(0.2~0.3초씩 늦게).
   - 이동: 분대장이 지나간 발자국(u._tr)을 따라간다. 넓은 길에서는 길 양쪽 벽을 따라 엇갈린 두 줄,
     건물 안·골목·문에서는 한 줄. 사이 간격은 넓은 곳 약 2.5m, 좁은 곳 약 1.5m.
   - 교전 중 이동(제압당했거나 최근 쏘거나 맞았음): 앞조·뒷조로 나눠 한 조가 멈춰 엄호하는 동안
     다른 조가 3~4초 뛰어 나간다(번갈아 이동).
   - 정지: 도착점 둘레에서 각자 엄폐가 가장 좋은 자리(소품·차량·벽)를 골라 흩어진다. 서로 붙지 않고,
     적이 있는 쪽을 보되 병사마다 조금씩 다른 방향을, 맨 뒤 한 명은 뒤쪽을 경계한다.
     건물 안이면 쏘는 쪽 창가에 늘어선다.
   - 사격: 분대가 쏠 때마다 쏠 수 있는 병사 몇 명이 실제로 쏜다(총구 섬광·예광탄이 그 병사에게서 나감).
     탄창을 다 쓰면 재장전하는데, 짝(둘씩 한 조)이 재장전 중이면 겹치지 않게 조금 더 쏜다.
   - 반응: 제압당하면 엎드리고, 엄폐 밖에 있던 병사는 가까운 엄폐로 기어간다. 옆 사람이 쓰러지면 잠깐 엎드린다.
   - 사상자: 맞을 때마다 병사 한 명씩 다친다(05g-casualty). 엄폐 밖·움직이는 병사가 먼저 맞는다.
   게임 규칙(명중률·피해)은 바뀌지 않는다. 이 파일은 분대 점을 움직이지 않는다. */
const MEN_N={rifle:9,mg:6,at:4,sniper:2,eng:6,mortar:5};
const MEN={gapW:.2,gapN:.12,spread:.11,bound:3.4,threatT:5,mag:{rifle:5,mg:3,at:1,sniper:4,eng:3,mortar:2},rl:{rifle:2.4,mg:4,at:3.2,sniper:2.6,eng:2.4,mortar:2.8}};
const menN=ty=>(typeof SQUAD==='object'&&SQUAD[ty])||MEN_N[ty]||4;
const menWX=(u,x1,z1,x2,z2)=>typeof wallCross==='function'&&wallCross(u,x1,z1,x2,z2);
/* 두 점 사이를 병사가 곧게 갈 수 있는가(벽·물·건물 경계) */
function menClear(u,x1,z1,x2,z2){if(!walkable(u,x2,z2))return false;const a=tileAt(x1,z1),b=tileAt(x2,z2);
  if(a&&b&&(a.t==='bldg')!==(b.t==='bldg')&&typeof wallCross!=='function')return false;return !menWX(u,x1,z1,x2,z2);}
function menHash(id,i){const s=Math.sin(id*127.1+i*311.7)*43758.5453;return s-Math.floor(s);}
function menInit(u){const n=menN(u.type);const M=[];
  for(let i=0;i<n;i++){const a=menHash(u.id,i)*6.283,r=i?.06+menHash(u.id,i+40)*.12:0;let x=u.x+Math.cos(a)*r,z=u.z+Math.sin(a)*r;if(!menClear(u,u.x,u.z,x,z)){x=u.x;z=u.z;}
    M.push({i,x,z,f:(u.face||0)*Math.PI/180,dead:0,mag:MEN.mag[u.type]||4,rl:0,lag:0,pr:0,ft:-99,aim:null,sp:null,spd:0,stk:0,sec:0});}
  Object.defineProperty(u,'_men',{value:M,writable:true,configurable:true,enumerable:false});u._tr=[[u.x,u.z]];if(typeof casLoad==='function')casLoad(u,M);return M;}
/* 지금 분대와 함께 움직이고 싸우는 병사: 전사·중상(쓰러짐)·후송 중·부상자 돌보는 중이 아닌 사람 (05g-casualty) */
const menAct=m=>!m.dead&&!m.down&&!m.gone&&!m.task;
const menAlive=u=>(u._men||[]).filter(menAct);
/* 분대장 발자국: 지나온 길을 점으로 남긴다(가장 최근이 앞) */
function menTrail(u){const T=u._tr||(u._tr=[[u.x,u.z]]);const h=T[0];const d=Math.hypot(u.x-h[0],u.z-h[1]);
  if(d>.04){T.unshift([u.x,u.z]);if(T.length>90)T.length=90;}}   // 머리 점을 끌고 다니면(느리게 걸을 때) 발자국이 벽을 가로지르는 직선이 된다: 새 점만 더한다
/* 발자국을 따라 분대장에게서 L만큼 뒤의 점과 진행 방향 */
function menTrailAt(u,L){const T=u._tr;let acc=0;for(let i=0;i<T.length-1;i++){const a=T[i],b=T[i+1];const s=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(acc+s>=L){const k=(L-acc)/(s||1);return {x:a[0]+(b[0]-a[0])*k,z:a[1]+(b[1]-a[1])*k,dx:(a[0]-b[0])/(s||1),dz:(a[1]-b[1])/(s||1),ok:1};}acc+=s;}
  const e=T[T.length-1];const f=(u.face||0)*Math.PI/180;return {x:e[0],z:e[1],dx:Math.cos(f),dz:Math.sin(f),ok:0};}
/* 병사 m이 곧게 갈 수 있는 발자국 중 분대장에게 가장 가까운 점(0.4초마다 다시 찾는다) */
function menVia(u,m,t,gx,gz){if(m.wp&&t-m.wpT<.4&&menClear(u,m.x,m.z,m.wp[0],m.wp[1]))return m.wp;const T=u._tr||[];m.wpT=t;m.wp=null;
  for(let i=0;i<T.length;i++){const p=T[i];if(Math.hypot(p[0]-m.x,p[1]-m.z)>2.6)continue;if(menClear(u,m.x,m.z,p[0],p[1])){m.wp=[p[0],p[1]];break;}}
  if(!m.wp&&typeof navPath==='function'&&gx!=null){// 발자국으로도 안 되면(따로 떨어졌던 병사) 문을 아는 길찾기로 제 길을 낸다
    if(!m.np||t-m.npT>1.5){m.npT=t;const me={type:u.type,x:m.x,z:m.z,r:Math.floor(m.z),c:Math.floor(m.x)};m.np=navPath(me,gx,gz)||[];}
    while(m.np.length&&Math.hypot(m.np[0][0]-m.x,m.np[0][1]-m.z)<.03)m.np.shift();
    if(m.np.length&&menClear(u,m.x,m.z,m.np[0][0],m.np[0][1]))m.wp=m.np[0];}
  return m.wp;}
/* 병사와 같은 공간(같은 건물 또는 바깥)에 있는 가장 가까운 발자국 */
function menTrailNear(u,m){const T=u._tr||[];const a=tileAt(m.x,m.z);let best=null,bd=1e9;
  for(const p of T){const b=tileAt(p[0],p[1]);if(!b)continue;const same=a&&((a.t==='bldg')===(b.t==='bldg'))&&(a.t!=='bldg'||a.blk===b.blk);const d=Math.hypot(p[0]-m.x,p[1]-m.z)+(same?0:5);if(d<bd){bd=d;best=p;}}
  return best;}
/* 점 p에서 옆(nx,nz) 방향으로 몇 칸까지 비어 있는가(벽·건물 전까지, 최대 lim) */
function menFree(u,x,z,nx,nz,lim){let d=0;for(let s=.05;s<=lim+1e-6;s+=.05){if(!menClear(u,x,z,x+nx*s,z+nz*s))break;d=s;}return d;}
/* 이 분대가 지금 위협을 받는가: 제압, 최근 사격, 최근 피격 */
function menThreat(u){const t=G.time||0;return u.supp>0||t-(u.firedT??-99)<MEN.threatT||t-(u._hitT??-99)<MEN.threatT;}
/* 위협 방향(라디안): 마지막으로 쏜 적 → 내가 노리는 적 → 바라보는 쪽 */
function menThreatDir(u){const t=G.time||0;if(u._thr&&t-u._thr[2]<12)return Math.atan2(u._thr[1]-u.z,u._thr[0]-u.x);
  if(u.tgt!=null){const e=G.units.find(z=>z.id===u.tgt);if(e)return Math.atan2(e.z-u.z,e.x-u.x);}return (u.face||0)*Math.PI/180;}
/* 새 이동 명령: 앞쪽(첫 경유점에 가까운) 병사부터 차례로 출발 */
function menNewOrder(u,M){const p=u.path[0]||[u.x,u.z];const L=M.filter(menAct).sort((a,b)=>Math.hypot(a.x-p[0],a.z-p[1])-Math.hypot(b.x-p[0],b.z-p[1]));
  const thr=menThreat(u);L.forEach((m,k)=>{m.rank=k;m.lag=k*(thr?.12:.24)+menHash(u.id,k+70)*.15;m.sp=null;});u._plan=0;}
/* 이동 중 병사 한 명이 갈 곳: 발자국 위 자기 순번 자리, 넓은 길이면 길 한쪽(벽 쪽)으로 비켜서 */
function menMoveSpot(u,m,k){const wide=cell(u.r,u.c).t!=='bldg';let gap=wide?MEN.gapW:MEN.gapN;
  const P=menTrailAt(u,.04+gap*k);const nx=-P.dz,nz=P.dx;
  if(!wide||k===0)return [P.x,P.z];
  const side=k%2?1:-1;const fr=menFree(u,P.x,P.z,nx*side,nz*side,.42),fl=menFree(u,P.x,P.z,-nx*side,-nz*side,.42);
  if(fr+fl<.3)return [P.x,P.z];                       // 좁은 길·골목: 한 줄
  let lat=Math.max(0,Math.min(fr-.07,.34));if(fr<.12)lat=0;   // 넓은 길: 벽을 따라 비켜선다
  return [P.x+nx*side*lat,P.z+nz*side*lat];}
/* 멈춘 분대: 병사마다 엄폐 자리 고르기 */
function menPlan(u,M){const L=M.filter(menAct);if(!L.length)return;const th=menThreatDir(u);const ux=Math.cos(th),uz=Math.sin(th);const here=cell(u.r,u.c);
  u._plan=1;u._planT=G.time||0;u._planF=th;
  if(here.t==='bldg'){// 건물 안: 쏘는 쪽 벽(창가)을 따라 늘어선다
    const ax=Math.abs(ux)>Math.abs(uz);const cx=u.c+.5,cz=u.r+.5;const n=L.length;
    L.forEach((m,k)=>{const lat=(k-(n-1)/2)/Math.max(1,n-1)*.62;let x,z;
      if(k<6){if(ax){x=cx+Math.sign(ux)*.31;z=cz+lat;}else{z=cz+Math.sign(uz)*.31;x=cx+lat;}}
      else{x=cx+(menHash(u.id,90+k)-.5)*.4;z=cz+(menHash(u.id,95+k)-.5)*.4;}
      m.sp=[x,z];m.sec=th+(k%3-1)*.35;});return;}
  const objs=typeof coverObjs==='function'?coverObjs(u):[];const C=[];
  for(const rad of [0,.1,.18,.26,.34,.42]){const na=rad?Math.round(rad*40):1;for(let i=0;i<na;i++){const a=i/na*6.283+menHash(u.id,i)*.3;const x=u.x+Math.cos(a)*rad,z=u.z+Math.sin(a)*rad;
      if(rad&&!menClear(u,u.x,u.z,x,z))continue;const t=tileAt(x,z);if(!t||t.t==='bldg')continue;
      let cov=typeof dirCoverAt==='function'?dirCoverAt(x,z,ux,uz,'inf',u,objs).cov:0;
      // 벽에 붙기: 옆에 건물 벽이 있으면 조금 더 좋다(시가지에서는 벽을 따라 선다)
      let hug=0;for(const [p,q] of [[1,0],[-1,0],[0,1],[0,-1]]){const tt=tileAt(x+p*.13,z+q*.13);if(tt&&tt.t==='bldg'){hug=.06;break;}}
      C.push({x,z,s:cov+hug-rad*.22+(t.t==='rubble'?.04:0)+(typeof trenchAt==='function'&&trenchAt(x,z)?.6:0)});/* 참호가 있으면 그 안으로 */}}
  const taken=[];const ord=L.slice().sort((a,b)=>(a.i===0?-1:0)-(b.i===0?-1:0));
  ord.forEach((m,k)=>{let best=null,bs=-1e9;for(const c of C){let s=c.s;for(const t of taken){const d=Math.hypot(c.x-t[0],c.z-t[1]);if(d<MEN.spread)s-=1;else if(d<MEN.spread*1.6)s-=.08;}
      s-=Math.hypot(c.x-m.x,c.z-m.z)*.05;if(s>bs){bs=s;best=c;}}
    const p=best?[best.x,best.z]:[u.x,u.z];taken.push(p);m.sp=p;
    // 경계 방향: 위협 쪽 부채꼴로 나눠 보고, 맨 뒤 한 명은 뒤를 본다
    const n=L.length;m.sec=(k===n-1&&n>=4&&!menThreat(u))?th+Math.PI:th+((k%5)-2)*.32;});}
/* 쏠 수 있는 병사 고르기(분대 사격 때) */
function menShooters(u,k){const M=u._men;if(!M)return [];const t=G.time||0;
  const ok=M.filter(m=>menAct(m)&&m.rl<=0&&m.lag<=0&&!(m.pr>0&&m.crawl));const mv=ok.filter(m=>m.spd<.05);const pool=(mv.length?mv:ok).slice();
  const out=[];for(let i=0;i<k&&pool.length;i++){const j=Math.floor(Math.random()*pool.length);out.push(pool.splice(j,1)[0]);}
  for(const m of out){m.ft=t;m.mag--;if(m.mag<=0){const bud=M[m.i^1];if(bud&&menAct(bud)&&bud.rl>0&&m.mag>-2)continue;m.rl=(MEN.rl[u.type]||2.5)*(.85+Math.random()*.3);}}
  return out;}
/* 매 틱: 병사들 */
function menTick(u,dt){let M=u._men;if(!M)M=menInit(u);const t=G.time||0;
  // 사상자는 체력에서 거꾸로 셈하지 않고, 맞을 때마다 병사 한 명씩 정한다(05g-casualty의 hurtMen)
  menTrail(u);const moving=!!(u.path&&u.path.length)&&!u.climb;
  const pe=moving?u.path[u.path.length-1].join(','):'';if(moving&&u._pe!==pe)menNewOrder(u,M);u._pe=pe;
  const thr=menThreat(u);const L=M.filter(menAct);
  if(!moving){if(!u._plan||(thr&&Math.abs(Math.atan2(Math.sin(menThreatDir(u)-u._planF),Math.cos(menThreatDir(u)-u._planF)))>.8)||t-(u._planT||0)>15||u._planK!==key(u.r,u.c)){menPlan(u,M);u._planK=key(u.r,u.c);}}
  else u._plan=0;
  // 번갈아 이동: 위협 속에서 움직이면 앞조·뒷조가 교대로 멈춘다
  const bound=moving&&thr&&L.length>=4;const ph=Math.floor(t/MEN.bound)%2;
  const base=UT[u.type].mv*SPD_K*(u.supp>0?.65:1);const sorted=moving?L.slice().sort((a,b)=>(a.rank??a.i)-(b.rank??b.i)):L;
  sorted.forEach((m,k)=>{if(m.rl>0)m.rl-=dt;if(m.rl<=0&&m.mag<=0){m.mag=MEN.mag[u.type]||4;m.rl=0;}if(m.pr>0)m.pr-=dt;if(m.lag>0){m.lag-=dt;if(moving){m.spd=0;return;}}
    let gx,gz,dash=1;
    if(moving){[gx,gz]=menMoveSpot(u,m,k);const team=k<Math.ceil(L.length/2)?0:1;
      if(bound&&team!==ph&&Math.hypot(gx-m.x,gz-m.z)<.75){gx=m.x;gz=m.z;m.hold=1;}else{if(bound&&m.hold){dash=1.9;}m.hold=bound&&Math.hypot(gx-m.x,gz-m.z)>.15?m.hold:0;}}
    else{const sp=m.sp||[u.x,u.z];gx=sp[0];gz=sp[1];
      if(u.supp>0&&!m.pr)m.pr=.6+Math.random()*.6;}            // 제압: 엎드린다
    // 곧장 못 가면(벽·건물 경계) 분대장이 지나간 발자국을 거꾸로 따라간다: 지금 자리에서 곧게 보이는 가장 앞쪽 발자국으로
    if(Math.hypot(gx-m.x,gz-m.z)>.006&&!menClear(u,m.x,m.z,gx,gz)){const w=menVia(u,m,t,gx,gz);if(w){gx=w[0];gz=w[1];}}
    let dx=gx-m.x,dz=gz-m.z,d=Math.hypot(dx,dz);
    if(d>.3)dash=Math.max(dash,1.7);else if(d>.12)dash=Math.max(dash,1.25);
    const crawl=m.pr>0&&!moving;m.crawl=crawl;let sp=base*(crawl?.35:dash)*(m.rl>0&&!moving?.6:1);
    if(d>.006){const st=Math.min(d,sp*dt);let nx=m.x+dx/d*st,nz=m.z+dz/d*st;
      if(!menClear(u,m.x,m.z,nx,nz)){m.stk+=dt;nx=m.x;nz=m.z;m.wp=null;// 막혔으면 서서 다음 틱에 발자국 길을 다시 찾는다(벽은 절대 통과하지 않는다)
        if(m.stk>2.5){const P=menTrailNear(u,m);if(P){nx=P[0];nz=P[1];}m.stk=0;}}   // 오래 끼어 있으면 가장 가까운 발자국 자리로 옮긴다
      else m.stk=0;
      m.spd=Math.hypot(nx-m.x,nz-m.z)/dt;m.x=nx;m.z=nz;if(m.spd>.02)m.f=Math.atan2(dz,dx);}
    else m.spd=0;

    if(Math.hypot(m.x-u.x,m.z-u.z)>2.2){const P=menTrailAt(u,.1);m.x=P.x;m.z=P.z;}
    if(m.spd<=.02){const aim=t-m.ft<1.2&&m.aim;m.f=aim?Math.atan2(m.aim[1]-m.z,m.aim[0]-m.x):(m.sec??m.f)+Math.sin(t*.5+m.i*1.7)*.18;}});
  // 서로 겹치지 않게
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),R=moving?.05:.07;if(d>=R)continue;
    const p=(R-d)/2,nx=d>1e-4?dx/d:Math.cos(i+j),nz=d>1e-4?dz/d:Math.sin(i+j);

/* 엔진에 끼우기: 틱 끝에 병사 갱신, 사격 때 실제로 쏜 병사·맞은 쪽 위협 방향 기록 */
{const _tick=rtTick;rtTick=function(dt){_tick(dt);if(!G||!G.units)return;for(const u of G.units)if(UT[u.type].cls==='inf')try{menTick(u,dt);}catch(e){(G.errs=G.errs||[]).push(String(e&&e.stack||e));}};
 const _shoot=rtShoot;rtShoot=function(a,d){if(UT[a.type].cls==='inf'){if(!a._men)menInit(a);const sh=menShooters(a,VOLLEY[a.type]||1);for(const m of sh)m.aim=[d.x,d.z];a._sh=sh.map(m=>m.i);}
   d._thr=[a.x,a.z,G.time||0];d._hitT=G.time||0;return _shoot(a,d);};
 const _sb=rtShootBldg;rtShootBldg=function(a,r,c){if(UT[a.type].cls==='inf'){if(!a._men)menInit(a);const sh=menShooters(a,Math.min(3,VOLLEY[a.type]||1));for(const m of sh)m.aim=[c+.5,r+.5];a._sh=sh.map(m=>m.i);}return _sb(a,r,c);};}

/* ---- 05g-casualty.js ---- */
/* ===================== CASUALTY: 맞은 곳에 따라 다치는 병사, 부상자 후송, 사기, 차량 부위 피해 =====================
   보병 분대에는 체력 막대가 없다. 총알·파편이 들어오면 병사 한 명 한 명이 맞고, 맞은 부위에 따라
     정상 → 경상(계속 싸움, 다리면 느림) → 중상(쓰러져 피를 흘림, 싸울 수 없음) → 전사
   가 정해진다. 몸통은 방탄판이 막아 주기도 한다. 분대의 화력(u.hp)은 싸울 수 있는 병사 수로 거꾸로 정한다.
   - 중상자: 엄폐 밖에 쓰러지면 가까운 전우가 엄폐 뒤로 끌어 옮기고, 위생병(없으면 전우)이 지혈한다(출혈이 느려짐).
     그다음 전우 한 명이 업고 자기 편 환자집결지(G.ccp)로 데려간다. 그동안 분대는 그 두 사람만큼 약해진다.
     업고 간 전우는 부상자를 넘기고 분대로 돌아온다. 피가 다 흐르면 전사.
   - 싸울 수 있는 병사가 아무도 없으면 분대는 끝난다. 남은 중상자는 그 자리에 남고(G.cas), 지나가는 아군 분대가 데려간다.
   - 제압: 맞거나 총알이 스치면 쌓이고(최대 3) 시간이 지나면 줄어든다. 1.6을 넘으면 꼼짝 못 하고 엎드린다(이동 불가, 사격 느림).
   - 사기(u.mor 0~100): 사상자·제압으로 떨어지고 조용하면 돌아온다. 50 아래는 흔들림(사격 느림), 20 아래는 공황:
     환자집결지 쪽으로 물러나고 쏘지 않으며 명령을 듣지 않는다(45까지 회복하면 다시 싸운다). 공황이어도 부상자는 업고 간다.
   - 차량: 대전차 화기에 뚫리면 엔진·궤도(기동 불능), 포·포탑(무장 파손), 승무원 부상, 탄약·연료(화재 → 승무원 탈출, 잠시 뒤 유폭).
     승무원 둘 이상이 쓰러지거나, 움직이지도 쏘지도 못하면 승무원이 차를 버린다. */
const CAS_K=1.15;               // 체력 1만큼의 피해가 병사 몇 명을 다치게 하나(분대 인원 비례) 보정
const PINNED=1.6;               // 이 이상 제압되면 꼼짝 못 함
const VCREW={tank:4,ifv:3,hmv:4,spg:4};
const WLOC={head:'머리',torso:'몸통',arm:'팔',leg:'다리'};
const WST={ok:'정상',lw:'경상',hw:'중상',kia:'전사',evac:'후송됨',rear:'후방'};
Object.assign(FXH,{cas(){},cook(){},vhit(){}});
const casStats=n=>{const N2=G.nats[n];return N2.cas||(N2.cas={kia:0,wia:0,lw:0,evac:0,dow:0,veh:0});};
const wiaDn=S=>{S.wia=Math.max(0,S.wia-1);};
function casLog(m){G.log.unshift(m);G.log=G.log.slice(0,8);}
const roleOf=(u,i)=>i===0?'분대장':i===1&&(u._men||[]).length>=5?'위생병':'';
/* 저장해 둔 부상 기록(u.ws)을 병사 목록에 입힌다. menInit(05f) 끝에서 부른다. */
function casLoad(u,M){if(!u.ws||u.ws.length!==M.length)u.ws=M.map(()=>({s:'ok'}));if(u.mor==null)u.mor=80+(u.rank||0)*5;
  for(const m of M)manFlags(u,m);}
function manFlags(u,m){const w=u.ws[m.i];m.dead=w.s==='kia'?(m.dead||G.time||.001):0;m.down=w.s==='hw'&&!w.y?1:0;m.gone=(w.s==='evac'||w.s==='rear'||w.s==='orph'||w.y)?1:0;
  if(m.down)m.pr=1e9;else if(m.pr>1e8)m.pr=0;if(m.dead||m.down||m.gone)m.task=null;}
const menOf=u=>u._men||(typeof menInit==='function'?menInit(u):[]);
/* 싸울 수 있는 병사(정상·경상, 분대에 있음). 부상자를 돌보는 사람도 센다. */
const casAble=u=>menOf(u).filter(m=>{const w=u.ws[m.i];return (w.s==='ok'||w.s==='lw')&&!w.y;});
/* 분대 화력 = 싸울 수 있는 병사 몫(경상은 0.7, 부상자를 돌보는 중이면 0.4) */
function casSync(u,by){const M=menOf(u);let v=0,able=0;for(const m of M){manFlags(u,m);const w=u.ws[m.i];if((w.s!=='ok'&&w.s!=='lw')||w.y)continue;able++;v+=(w.s==='lw'?.7:1)*(m.task?.4:1);}

  u.hp=Math.max(.1,Math.round(hpMax(u)*v/M.length*10)/10);return able;}
/* 분대가 끝나면 남은 중상자는 그 자리에 남는다 */
function casOrphan(u){G.cas=G.cas||[];for(const m of menOf(u)){const w=u.ws[m.i];if(w.s==='hw'&&!w.y){G.cas.push({id:'c'+u.id+'_'+m.i,nat:u.nat,x:m.x,z:m.z,b:w.b,a:w.a||0,w:w.w,s:'hw'});w.s='orph';manFlags(u,m);}}}
/* ---------- 맞은 부위와 결과 ---------- */
function pickW(t){let r=Math.random(),a=0;for(const k in t){a+=t[k];if(r<a)return k;}return Object.keys(t).pop();}
const LOC_OPEN={head:.1,torso:.42,arm:.2,leg:.28},LOC_COV={head:.22,torso:.2,arm:.38,leg:.2},LOC_FRAG={head:.12,torso:.35,arm:.25,leg:.28};
const OUT={bullet:{head:{kia:.7,hw:.3},torso:{kia:.3,hw:.6,lw:.1},arm:{lw:.8,hw:.2},leg:{hw:.45,lw:.55}},
  frag:{head:{kia:.6,hw:.4},torso:{kia:.25,hw:.6,lw:.15},arm:{lw:.65,hw:.35},leg:{hw:.5,lw:.5}}};
/* 병사 m이 맞았다: 결과(stop/lw/hw/kia) */
function woundRoll(kind,cov){if(kind==='blast'||kind==='crush'){const loc=pickW(LOC_FRAG);return {loc,out:pickW(kind==='blast'?{kia:.42,hw:.43,lw:.15}:{kia:.38,hw:.45,lw:.17})};}
  const frag=kind==='frag';const loc=pickW(frag?LOC_FRAG:cov>=.25?LOC_COV:LOC_OPEN);
  if(loc==='torso'&&Math.random()<(frag?.3:.45))return {loc,out:'stop'};      // 방탄판이 막음
  return {loc,out:pickW(OUT[frag?'frag':'bullet'][loc])};}
function woundMan(u,m,kind,cov,by){const w=u.ws[m.i];let {loc,out}=woundRoll(kind,cov);const t=G.time||0;
  if(out==='stop'){m.pr=Math.max(m.pr||0,1.4+Math.random());u.supp=Math.min(3,(u.supp||0)+.3);return 'stop';}
  if(w.s==='hw')out='kia';else if(out==='lw'&&w.s==='lw')out='hw';
  const S=casStats(u.nat);const was=w.s;w.s=out;w.w=loc;u.casT=t;
  if(out==='hw'){w.b=(loc==='head'||loc==='torso'?70:kind==='blast'?90:140)+Math.random()*120;w.a=0;w.dt=t;S.wia++;}
  else if(out==='kia'){S.kia++;if(was==='hw')wiaDn(S);}
  else if(out==='lw'){S.lw++;if(loc==='leg')w.slow=1;}
  manFlags(u,m);
  u.mor=Math.max(0,(u.mor??80)-(out==='kia'?12:out==='hw'?9:4)-(m.i===0&&out!=='lw'?10:0));
  for(const o of u._men)if(o!==m&&menAct(o)&&Math.hypot(o.x-m.x,o.z-m.z)<.3)o.pr=Math.max(o.pr||0,1.2+Math.random());
  if(u.nat===G.viewer||by&&by.nat===G.viewer){const who=roleOf(u,m.i)||'병사';casLog(`${natName(u.nat)} ${UT[u.type].n} ${who} ${WLOC[loc]} ${out==='kia'?'전사':out==='hw'?'중상':'경상'}`);}

/* 피해가 어느 병사에게 가나: 총알은 노출되고 움직이는 사람, 폭발은 터진 곳에 가까운 사람 */
function casPick(u,kind,by,o,M){const ex=kind==='blast'||kind==='frag'||kind==='crush';
  const L=M.filter(m=>!m.dead&&!m.gone&&(ex||!m.down));if(!L.length)return null;
  let ux=1,uz=0;if(by){const d=Math.hypot(by.x-u.x,by.z-u.z)||1;ux=(by.x-u.x)/d;uz=(by.z-u.z)/d;}
  const inB=cell(u.r,u.c).t==='bldg';const objs=!ex&&!inB&&typeof coverObjs==='function'?coverObjs(u):null;
  let best=null,bs=-1e9,bc=0;
  for(const m of L){let cov=.4,s;
    if(!ex){const t=tileAt(m.x,m.z);if(t&&t.t!=='bldg'&&objs)cov=Math.max(TT[t.t].cov||0,dirCoverAt(m.x,m.z,ux,uz,'inf',u,objs).cov);
      s=Math.random()*.7-cov+(m.spd>.05?.25:0)-(m.pr>0?.15:0)-(m.down?.3:0);}
    else if(o&&o.x!=null){const d=Math.hypot(m.x-o.x,m.z-o.z);s=Math.random()*.6-d/Math.max(.3,o.rad||.4)-(m.pr>0?.15:0);}
    else s=Math.random();
    if(s>bs){bs=s;best=m;bc=cov;}}
  return {m:best,cov:bc};}
function hurtMen(u,amt,by,o){const M=menOf(u);const kind=o.kind||'bullet';
  u.supp=Math.min(3,(u.supp||0)+(kind==='bullet'?.2:.5));u._hitT=G.time||0;if(by)u._thr=[by.x,by.z,G.time||0];
  if(u.nocas){casSync(u,by);return;}                         // 테스트용: 다치지 않는 표적
  const ex=amt/hpMax(u)*M.length*CAS_K;let c=Math.floor(ex)+(Math.random()<ex%1?1:0);
  if(kind==='bullet'&&by&&!UT[by.type].ex)c=Math.min(c,o.hits||c);
  for(let i=0;i<c;i++){const p=casPick(u,kind,by,o,M);if(!p)break;woundMan(u,p.m,kind,p.cov,by);}
  casSync(u,by);}
/* ---------- 차량 ---------- */
function vdOf(u){return u.vd||(u.vd={mob:0,gun:0,crew:Array.from({length:VCREW[u.type]||3},()=>'ok'),fire:0});}
function hurtVeh(u,amt,by,o){const V=vdOf(u);const ta=by?UT[by.type]:null;const kind=o.kind||'bullet';
  u.hp=Math.round((u.hp-amt)*10)/10;u._hitT=G.time||0;
  const heavy=kind==='blast'||kind==='crush'||(ta&&ta.atk.veh>=5);const S=casStats(u.nat);const nm=`${natName(u.nat)} ${UT[u.type].n}`;
  const rolls=Math.min(3,Math.max(1,o.hits||1));const crewHit=()=>{const i=V.crew.findIndex(c=>c==='ok');if(i<0)return;V.crew[i]=Math.random()<.4?'kia':'hw';if(V.crew[i]==='kia')S.kia++;else S.wia++;};
  for(let k=0;k<rolls;k++){
    if(heavy){const pen=UT[u.type].armor?(by&&(by.type==='at'||by.type==='eng')?.75:by&&by.type==='tank'?.6:.35):u.type==='hmv'?.95:.85;if(Math.random()>pen)continue;
      const r=Math.random();
      if(r<.28){if(!V.mob){V.mob=1;L(`${nm} 기동 불능`);}}
      else if(r<.5){if(!V.gun){V.gun=1;L(`${nm} 무장 파손`);}}
      else if(r<.78){crewHit();if(Math.random()<.4)crewHit();}
      else{V.fire=1;}
      FXH.vhit(u,r);}
    else if(u.type==='hmv'&&Math.random()<.18)crewHit();}       // 험비는 장갑이 얇아 소총탄에도 승무원이 다친다
  if(!G.units.includes(u))return;
  const crewDown=V.crew.filter(c=>c!=='ok').length;
  if(u.hp<=0){S.veh++;casCook(u,.5);kill(u,by);return;}

/* ===================== 포탄: 박격포·자주포·포격 지원이 실제 궤적으로 날아간다 =====================
   쏘는 순간 피해가 나지 않는다. 포탄(G.shells)이 포물선을 그리며 날아가고, 떨어진 곳에서 터진다.
   조준은 흩어진다(거리에 비례). 가끔은 각을 잘못 잡아 크게 빗나가고, 날아가다 건물에 걸리면 그 벽·지붕에서 터진다.
   폭발은 반경 안 모두에게 피해를 준다. 건물 안에 있으면 거의 막아 주지만, 포탄이 바로 그 건물 그 층에 꽂히면 크게 다친다.
   높이 단위는 층(04b-sight와 같다). */
const SHELL_R=1.05;            // 폭발 반경(칸)
const SHELL_MIS=.1;            // 각도를 잘못 잡아 크게 빗나갈 확률
/* 조준점에서 흩어진 실제 탄착점 */
function shellAim(x0,z0,tx,tz,spread){const d=Math.hypot(tx-x0,tz-z0);let e=(spread??1)*(.1+d*.06);let mis=false;
  if(Math.random()<SHELL_MIS){e*=3.2;mis=true;}
  const a=Math.random()*6.283,rr=e*Math.sqrt(Math.random());
  // 크게 빗나갈 때는 주로 사거리 방향(짧거나 길게)으로
  if(mis){const k=(Math.random()<.5?-1:1)*(.6+Math.random()*.6)*e,dx=(tx-x0)/(d||1),dz=(tz-z0)/(d||1);return [tx+dx*k+(Math.random()-.5)*.4,tz+dz*k+(Math.random()-.5)*.4,true];}
  return [tx+Math.cos(a)*rr,tz+Math.sin(a)*rr,false];}
/* 포탄 하나를 띄운다. o: {x0,z0,h0,tx,tz,n,src,pw,spread,delay,T,ap,kind} */
let SHELL_ID=1;
function shellLaunch(o){G.shells=G.shells||[];const [x1,z1,mis]=shellAim(o.x0,o.z0,o.tx,o.tz,o.spread);
  const x1c=Math.min(N-.02,Math.max(.02,x1)),z1c=Math.min(N-.02,Math.max(.02,z1));const d=Math.hypot(x1c-o.x0,z1c-o.z0);
  const s={id:SHELL_ID++,x0:o.x0,z0:o.z0,h0:o.h0??.6,x1:x1c,z1:z1c,t0:(G.time||0)+(o.delay||0),T:o.T??(1.1+d*.16),ap:o.ap??(2.2+d*.55),
    n:o.n,src:o.src??null,type:o.type||'mortar',pw:o.pw??1,mis,k:0};
  G.shells.push(s);return s;}
/* 포탄 위치: k(0~1) */
function shellPos(s,k){return [s.x0+(s.x1-s.x0)*k,s.z0+(s.z1-s.z0)*k,s.h0*(1-k)+4*s.ap*k*(1-k)];}
/* 매 틱: 날아가는 포탄을 움직이고, 건물에 걸리거나 땅에 닿으면 터뜨린다 */
function shellTick(){if(!G.shells||!G.shells.length)return;const keep=[];
  for(const s of G.shells){const t=(G.time||0)-s.t0;if(t<0){keep.push(s);continue;}
    const k1=Math.min(1,t/s.T),k0=s.k;let hit=null;
    const [ax,az]=shellPos(s,k0),[bx,bz]=shellPos(s,k1);const steps=Math.max(1,Math.ceil(Math.hypot(bx-ax,bz-az)/.06));
    for(let i=1;i<=steps&&!hit;i++){const k=k0+(k1-k0)*i/steps;if(k<.08)continue;const [x,z,h]=shellPos(s,k);const r=Math.floor(z),c=Math.floor(x);if(!inb(r,c))continue;const X=G.map[r][c];
      if(X.t!=='bldg')continue;const bh=bldgH(X);if(h>bh)continue;const b=bldgBox(r,c);if(x<b[0]||x>b[1]||z<b[2]||z>b[3])continue;
      hit={x,z,h:Math.max(0,h),r,c};}
    s.k=k1;
    if(hit){shellBoom(s,hit.x,hit.z,hit.h,hit.r,hit.c);continue;}
    if(k1>=1){shellBoom(s,s.x1,s.z1,0,null,null);continue;}
    keep.push(s);}

/* ---- 05h-fire.js ---- */
/* ===================== 건물 화재 =====================
   폭발(포탄·대전차 화기·공습·붕괴)이 건물에 불을 붙인다. 불은 커지면서 위층으로 타고 오르고(x.fireFl),
   같은 블록 옆 칸으로, 드물게 붙어 있는 다른 건물로 번진다. 타는 동안 건물이 상하고 안의 보병이 다친다.
   연료(x.fuel)를 다 태우면 꺼지고 그을린 채 남는다(x.burnt). 많이 상하면 무너진다(damageBldg).
   G.fires: 타고 있는 칸 key 목록. */
const FIRE_DPS=.32;            // 다 타오를 때 초당 건물 피해
const FIRE_HURT=.22;           // 다 타오를 때 초당 보병 피해
function ignite(r,c,p){if(!inb(r,c))return false;const x=G.map[r][c];if(x.t!=='bldg'||x.fire>0||x.burnt)return false;if(Math.random()>=(p??1))return false;
  x.fire=.25;x.fuel=35+Math.random()*45;x.fireFl=0;x.fdmg=0;G.fires=G.fires||[];G.fires.push(key(r,c));
  L(`${x.obj!=null?G.objs[x.obj].name+' ':''}건물에 불이 붙었다`);bump();return true;}
function fireTick(dt){if(!G.fires||!G.fires.length)return;const keep=[];
  for(const k of G.fires){const r=kr(k),c=kc(k);const x=G.map[r][c];if(x.t!=='bldg'||!(x.fire>0)){x.fire=0;continue;}
    x.fire=Math.min(1,x.fire+dt*.045);x.fuel-=dt*(.4+x.fire*.6);
    x.fireFl=Math.min(Math.max(0,x.f-1),x.fireFl+dt*.05*x.fire);
    x.fdmg+=dt*FIRE_DPS*x.fire;if(x.fdmg>=1){const a=Math.floor(x.fdmg);x.fdmg-=a;damageBldg(r,c,a);if(x.t!=='bldg')continue;}
    // 번짐
    for(const [a,b] of nbrs(r,c)){const y=G.map[a][b];if(y.t!=='bldg'||y.fire>0||y.burnt)continue;const same=y.blk!=null&&y.blk===x.blk;
      if(Math.random()<dt*x.fire*(same?.022:.004))ignite(a,b,1);}
    // 안의 보병
    for(const u of G.units.slice()){if(u.r!==r||u.c!==c||UT[u.type].cls!=='inf')continue;const fl=curFl(u);if(fl>x.fireFl+1.2&&x.fire<.8)continue;
      u._burn=(u._burn||0)+dt*FIRE_HURT*x.fire;if(u._burn>=1){u._burn-=1;blastHurt(u,1,null,{kind:'blast'});}u.supp=Math.max(u.supp||0,1);   // 연기·불길: 1씩 모아서 한 명씩 다친다
      // 멈춰 있는 부대는 불을 피해 나간다
      if(G.units.includes(u)&&x.fire>.55&&!(u.path&&u.path.length)&&u._fleeK!==k){u._fleeK=k;const out=fireExit(u);if(out)orderMove(u,out[0],out[1]);}}
    if(x.fuel<=0){x.fire=0;x.burnt=1;bump();continue;}

/* 불난 건물에서 가장 가까운 바깥 칸 */
function fireExit(u){let best=null,bd=1e9;for(let a=u.r-3;a<=u.r+3;a++)for(let b=u.c-3;b<=u.c+3;b++){if(!inb(a,b))continue;const y=G.map[a][b];if(y.t==='bldg'||mcost(u.type,y)===Infinity)continue;
  const d=dist(u.r,u.c,a,b);if(d<bd){bd=d;best=[a,b];}}return best;}
/* 건물이 무너지면 옆 건물에 불이 옮겨 붙기도 한다 */
{const _db=damageBldg;damageBldg=function(r,c,amt){const x=G.map[r][c];const was=x.t==='bldg';_db(r,c,amt);

/* ---- 05i-breach.js ---- */
/* ===================== 벽 뚫기: 대전차 화기·전차포·폭약으로 적이 든 건물을 친다 =====================
   건물 안 적 보병은 창가에 붙지 않으면 총으로 맞추기 어렵다. 대전차팀·공병·전차는 그 층 외벽을 겨눠 쏴서
   구멍(G.holes)을 내고, 그 층 사람들을 크게 다치게 한다. 위아래 층은 덜 다치고, 불이 붙기도 한다.
   표적은 보이는 적, 또는 방금 그 건물에서 쏜(총구 화염으로 들킨) 적이다. */

function breach(a,P){const ta=UT[a.type];a.shot=G.turn;a.firedT=G.time||0;a.face=Math.atan2(P.z-a.z,P.x-a.x)*180/Math.PI;

/* ---- 05j-radio.js ---- */
/* ===================== 무전·지휘 지연 =====================
   플레이어 명령은 무전으로 내려간다.
   - 지휘소(자기 출발 지역 가운데)에서 부대까지 멀수록 조금 늦게 닿는다(가까우면 1초 남짓, 멀어도 3초 안팎).
   - 한 세력의 무전망은 한 번에 한 교신만 싣는다. 명령을 몰아 내리면 줄을 서서 차례로 나간다.
     여러 부대를 함께 골라 내린 명령은 교신 한 번이다.
   - 적 전자전팀 재밍 반경 안의 지상 부대는 교신이 끊긴다. 재송신을 몇 번 하다가 끝내 전령이 뛰어가 전한다.
   - 드론은 조종기로 바로 움직이므로 거의 늦지 않는다(재밍은 05f-air가 따로 다룬다).
   - 명령을 기다리는 동안 부대는 하던 일을 계속하고, 적이 보이면 알아서 쏜다.
   AI도 재밍 반경 안의 부대에는 새 명령이 잘 닿지 않는다(aiThink 감싸기). */
const RADIO={base:.6,per:.035,max:1.4,talk:.35,fly:.25,jamOk:.35,retry:1.8,tries:3,runner:2.5};
const radioOn=()=>!!G&&G.radio!==false&&G.scn!=='tut';
/* 지휘소: 출발 지역 칸들의 가운데 */
function hqOf(n){G.hq=G.hq||{};if(G.hq[n])return G.hq[n];const sp=zoneSpots(n);let x=N/2,z=N/2;
  if(sp.length){x=sp.reduce((a,p)=>a+p[1]+.5,0)/sp.length;z=sp.reduce((a,p)=>a+p[0]+.5,0)/sp.length;}return G.hq[n]={x,z};}
/* 지상 부대가 적 재밍 반경 안에 있나 */
function radioCut(u){return !UT[u.type].fly&&typeof jammedBy==='function'&&!!jammedBy(u);}
function radioExec(k,a,us){us=us.filter(u=>G.units.includes(u));if(!us.length)return;
  if(k==='move')orderGroupMove(us,a[0],a[1]);
  else if(k==='atk'){const e=G.units.find(o=>o.id===a[0]);if(e)for(const g of us)if(UT[g.type].rng[1])orderAttack(g,e);}
  else if(k==='bldg'){if(G.map[a[0]][a[1]].t==='bldg')for(const g of us)orderBldg(g,a[0],a[1]);}
  else if(k==='stop')us.forEach(orderStop);
  else if(k==='floor')us.forEach(g=>orderFloor(g,a[0]));
  else if(k==='hold')us.forEach(g=>g.hold=a[0]);
  for(const g of us)g._ack=G.time||0;}
/* 명령 보내기: 바로 실행하지 않고 교신 대기열(G.rq)에 넣는다 */
function radioSend(n,us,k,a){us=us.filter(u=>u&&G.units.includes(u));if(!us.length)return null;
  if(!radioOn()){radioExec(k,a||[],us);return null;}
  const now=G.time||0;G.rq=G.rq||[];G.rnet=G.rnet||{};
  // 같은 부대에 아직 닿지 않은 명령은 새 명령으로 바뀐다
  const ids=new Set(us.map(u=>u.id));for(const e of G.rq)e.us=e.us.filter(id=>!ids.has(id));G.rq=G.rq.filter(e=>e.us.length);
  const fly=us.filter(u=>UT[u.type].fly),gnd=us.filter(u=>!UT[u.type].fly);let out=null;
  if(fly.length)G.rq.push(out={id:(G.rqI=(G.rqI||0)+1),nat:n,us:fly.map(u=>u.id),k,a:a||[],t0:now,at:now+RADIO.fly,n:0});
  if(gnd.length){const st=Math.max(now,G.rnet[n]||0);G.rnet[n]=st+RADIO.talk;const h=hqOf(n);
    const cx=gnd.reduce((s,u)=>s+u.x,0)/gnd.length,cz=gnd.reduce((s,u)=>s+u.z,0)/gnd.length;
    const at=st+RADIO.talk+RADIO.base+Math.min(RADIO.max,RADIO.per*Math.hypot(cx-h.x,cz-h.z));
    G.rq.push(out={id:(G.rqI=(G.rqI||0)+1),nat:n,us:gnd.map(u=>u.id),k,a:a||[],t0:now,at,n:0});}
  if(n===G.viewer&&typeof sfx==='function')sfx('radio',.5);bump();return out;}
/* 이 부대에 아직 닿지 않은 명령 */
function radioPend(u){if(!G.rq)return null;for(const e of G.rq)if(e.us.includes(u.id))return e;return null;}
/* 매 틱: 때가 된 교신을 전한다. 재밍 반경 안이면 대개 실패하고 다시 보낸다. */
function radioTick(){if(!G.rq||!G.rq.length)return;const now=G.time||0;const keep=[];
  for(const e of G.rq){if(e.at>now){keep.push(e);continue;}
    const us=e.us.map(id=>G.units.find(o=>o.id===id)).filter(Boolean);if(!us.length)continue;
    if(e.run){radioExec(e.k,e.a,us);if(e.nat===G.viewer)L(`${UT[us[0].type].n} 전령 도착, 명령 전달`);continue;}
    const ok=[],cut=[];for(const u of us){if(radioCut(u)&&Math.random()>RADIO.jamOk)cut.push(u);else ok.push(u);}
    if(ok.length){radioExec(e.k,e.a,ok);if(e.nat===G.viewer&&typeof sfx==='function')sfx('radio',.3);}
    if(cut.length){const r={...e,us:cut.map(u=>u.id),n:e.n+1,jam:1};
      if(r.n>=RADIO.tries){r.run=1;r.at=now+RADIO.runner;}else r.at=now+RADIO.retry*(.8+Math.random()*.4);
      if(e.nat===G.viewer&&!e.jam)L(`${UT[cut[0].type].n} 무전 두절 — 재송신 중`);keep.push(r);}
    bump();}

/* 원래 함수 감싸기: 새 판 설정, 매 틱 교신, AI 재밍 */
{const _n=newGame;newGame=function(cfg){const r=_n(cfg);let on=cfg&&cfg.radio;
   if(on==null){try{const el=typeof document!=='undefined'&&document.getElementById('opt-radio');on=el?el.value!=='0':true;}catch(e){on=true;}}
   G.radio=!!on;G.rq=[];G.rnet={};G.hq={};return r;};}
{const _t=rtTick;rtTick=function(dt){_t(dt);if(G&&!G.over)radioTick();};}
{const _a=aiThink;aiThink=function(n){if(!radioOn())return _a(n);
   const cut=[];for(const u of G.units)if(u.nat===n&&radioCut(u))cut.push([u,u.path?u.path.slice():[],u.tgt,u.tgtTile,u.dest?u.dest.slice():null,u.hold]);
   const r=_a(n);
   for(const [u,p,t,tt,d,h] of cut){if(!G.units.includes(u)||Math.random()<RADIO.jamOk)continue;u.path=p;u.tgt=t;u.tgtTile=tt;u.dest=d;u.hold=h;}// 새 명령이 닿지 않았다
   return r;};}

/* ---- 05j-vet.js ---- */
/* ===================== VETERANS: 분대 경험치·계급·이름 붙은 베테랑·고참 명부 =====================
   - 분대는 싸우면서 경험치(u.xp)를 얻는다: 적을 쓰러뜨리거나(전사 8, 중상 5, 경상 2), 차량·드론·분대를 끝내거나,
     거점을 잡거나, 총알 속에서 버티거나(제압된 채 살아 있는 시간), 전투가 끝날 때 살아 있으면.
   - 계급(u.rank 0~3): 신병 → 숙련 → 노련 → 정예. 계급마다 화력 +10%(rawDmg), 사격 간격 −5%, 제압이 더 빨리 풀리고,
     사기 상한·회복이 오른다(morTick이 rank를 본다).
   - 병사 한 명이 적을 셋 이상 쓰러뜨리면 이름이 붙은 베테랑이 된다(u.vn[i], 개인 전과 u.vk[i]). 분대가 노련이 되면 분대장도 이름을 얻는다.
     싸울 수 있는 베테랑이 있는 분대는 사상자가 나도 사기가 덜 꺾인다. 베테랑이 전사하면 분대 사기가 크게 떨어진다.
   - 고참 명부(localStorage): 사람이 지휘한 일반 작전이 끝나면 살아남은 숙련 이상 분대가 명부에 오르고, 다음 작전 시작 때
     같은 병종 부대에 다시 배치된다. 잃은 병사만큼 신병이 채워져 경험치는 조금 묽어진다. 전사한 베테랑은 추모 명단에 남는다. */
const VET={ranks:[{n:'신병',xp:0},{n:'숙련',xp:25},{n:'노련',xp:65},{n:'정예',xp:130}],
  xp:{kia:8,hw:5,lw:2,veh:30,air:12,inf:10,cap:15,end:10,fire:.25},named:3,cdK:.05,suppK:.25,keep:.35,maxRoster:8,
  key:'triad-vets',onKey:'triad-vets-on'};
const VET_TITLES=[[10,'중사'],[6,'하사'],[3,'병장']];
const VET_SUR='김이박최정강조윤장임한오서신권황안송류전홍고문양손배백허남심노하곽성차주우구민진나지엄채원천방공현함변염여추도소석선설마길연위표명기반왕금옥육인맹제모탁국어은편용예경봉사부황보'.split('');
const VET_GIV=['민준','서준','도윤','예준','시우','하준','주원','지호','지후','준우','현우','건우','우진','선우','서진','민재','현준','연우','유준','정우','승우','승현','시윤','준혁','은우','지환','승민','지우','유찬','윤우','민성','준서','하율','태윤','재윤','동현','성민','태민','지훈','상우','다은','서연','지민','수아','하은','예린','채원','소율','유나','가은'];
const rankOf=xp=>{let r=0;for(let i=0;i<VET.ranks.length;i++)if((xp||0)>=VET.ranks[i].xp)r=i;return r;};
const rankName=u=>VET.ranks[u.rank||0].n;
const vetTitleOf=(i,k,r)=>i===0&&r>=2&&k<6?'하사':vetTitle(k);   // 노련 분대의 분대장은 하사 이상
const vetTitle=k=>{for(const [n,t] of VET_TITLES)if(k>=n)return t;return '일병';};
function vetName(){const used=new Set();for(const u of G.units||[])for(const s of u.vn||[])if(s)used.add(s);
  for(let i=0;i<30;i++){const s=VET_SUR[Math.floor(Math.random()*VET_SUR.length)]+VET_GIV[Math.floor(Math.random()*VET_GIV.length)];if(!used.has(s))return s;}
  return VET_SUR[0]+VET_GIV[Math.floor(Math.random()*VET_GIV.length)];}
const vetMenN=u=>u.ws?u.ws.length:UT[u.type].cls==='inf'&&typeof menOf==='function'?menOf(u).length||1:1;
function vetArr(u){const n=vetMenN(u);if(!u.vn||u.vn.length!==n){const o=u.vn||[],k=u.vk||[];u.vn=Array.from({length:n},(_,i)=>o[i]||null);u.vk=Array.from({length:n},(_,i)=>k[i]||0);}return u;}
const vetAble=(u,i)=>!u.ws||(u.ws[i]&&(u.ws[i].s==='ok'||u.ws[i].s==='lw')&&!u.ws[i].y);
/* 이름 붙은 베테랑 [{i,name,k,title,able}] */
function vetMen(u){if(!u.vn)return [];const o=[];u.vn.forEach((s,i)=>{if(s)o.push({i,name:s,k:u.vk[i]||0,title:vetTitleOf(i,u.vk[i]||0,u.rank||0),able:vetAble(u,i),kia:!!(u.ws&&u.ws[i]&&u.ws[i].s==='kia')});});return o;}
const vetLabel=v=>`${v.title} ${v.name}`;
/* 경험치를 주고 계급이 오르면 알린다 */
function giveXp(u,amt){if(!u||!(amt>0)||!G.units.includes(u))return;const was=u.rank||0;u.xp=Math.round(((u.xp||0)+amt)*100)/100;const r=rankOf(u.xp);
  if(r>was){u.rank=r;L(`${natName(u.nat)} ${UT[u.type].n} ${VET.ranks[r].n}(으)로 진급`);
    if(r>=2){vetArr(u);if(!u.vn[0]&&vetAble(u,0)){u.vn[0]=vetName();L(`${natName(u.nat)} ${UT[u.type].n} 분대장 ${u.vn[0]}, 베테랑으로 이름을 올림`);}}}
  else u.rank=Math.max(was,r);}
/* 쏜 사람 중 하나에게 개인 전과를 준다 */
function creditMan(by){if(!by||!G.units.includes(by))return;vetArr(by);const n=by.vn.length;
  let pool=(by._sh||[]).filter(i=>i<n&&vetAble(by,i));if(!pool.length)pool=[...Array(n).keys()].filter(i=>vetAble(by,i));if(!pool.length)return;
  const i=pool[Math.floor(Math.random()*pool.length)];by.vk[i]=(by.vk[i]||0)+1;
  if(!by.vn[i]&&by.vk[i]>=VET.named){by.vn[i]=vetName();L(`${natName(by.nat)} ${UT[by.type].n} ${by.vn[i]}, 적 ${by.vk[i]}명을 쓰러뜨려 베테랑이 됨`);}}
/* 베테랑이 전사했나(총에 맞아서든 피를 흘려서든) */
function vetWatch(u){if(!u.vn||!u.ws)return;for(let i=0;i<u.vn.length;i++){if(!u.vn[i]||!u.ws[i]||u.ws[i].s!=='kia')continue;u.vf=u.vf||[];if(u.vf.includes(i))continue;u.vf.push(i);vetFall(u,i);u.mor=Math.max(0,(u.mor??0)-10);}}
function vetFall(u,i){const v=vetMen(u).find(x=>x.i===i);if(!v)return;G.vetFallen=G.vetFallen||[];G.vetFallen.push({nat:u.nat,name:v.name,title:v.title,k:v.k,type:u.type,rid:u.rid||null});
  L(`${natName(u.nat)} 베테랑 ${vetLabel(v)} 전사`);}

/* ---------- 기존 규칙에 걸기 ---------- */
if(typeof woundMan==='function'){const _wm=woundMan;woundMan=function(u,m,kind,cov,by){vetArr(u);const m0=u.mor??80;const out=_wm(u,m,kind,cov,by);
    if(out==='stop')return out;
    const lost=m0-(u.mor??80);if(lost>0&&vetMen(u).some(v=>v.able&&v.i!==m.i))u.mor=Math.min(100,(u.mor??0)+lost*VET.keep);   // 베테랑이 버티면 덜 흔들린다
    if(by&&by.nat!==u.nat&&G.units.includes(by)){giveXp(by,VET.xp[out]||0);if(out==='kia'||out==='hw')creditMan(by);}
    return out;};}
{const _k=kill;kill=function(u,by){const r0=by?by.rank||0:0;const cls=UT[u.type].cls;
    if(u.rid){G.vetLost=G.vetLost||[];G.vetLost.push(u.rid);}
    _k(u,by);
    if(by){by.rank=r0;if(by.nat!==u.nat)giveXp(by,VET.xp[cls]||0);if(cls!=='inf')creditMan(by);}};}   // kill()의 옛 전과식 계급을 경험치 계급으로 되돌린다
{const _am=afterMove;afterMove=function(u){const x=cell(u.r,u.c);const was=x.obj!=null?x.owner:undefined;_am(u);if(was!==undefined&&G.units.includes(u)&&cell(u.r,u.c).owner===u.nat&&was!==u.nat)giveXp(u,VET.xp.cap);};}
{const _t=rtTick;rtTick=function(dt){const over0=!!(G&&G.over);_t(dt);if(!G||!G.units)return;
    for(const u of G.units){const r=u.rank||0;vetWatch(u);if((u.supp||0)>.3&&!UT[u.type].fly)giveXp(u,VET.xp.fire*dt);
      if(r){u.cd=(u.cd||0)-dt*VET.cdK*r;if(u.supp>0)u.supp=Math.max(0,u.supp-dt/3*VET.suppK*r);}}
    if(!over0&&G.over)vetEnd();};}

/* ---------- 고참 명부 ---------- */
const vetStore={get(){try{if(typeof localStorage==='undefined')return [];const a=JSON.parse(localStorage.getItem(VET.key)||'{}');return Array.isArray(a.roster)?a:{roster:[],fallen:[]};}catch(e){return {roster:[],fallen:[]};}},
  set(o){try{if(typeof localStorage!=='undefined')localStorage.setItem(VET.key,JSON.stringify(o));}catch(e){}},
  on(){try{return typeof localStorage==='undefined'||localStorage.getItem(VET.onKey)!=='0';}catch(e){return true;}},
  setOn(v){try{localStorage.setItem(VET.onKey,v?'1':'0');}catch(e){}}};
function vetRoster(){const s=vetStore.get();return {roster:s.roster||[],fallen:s.fallen||[]};}
/* 새 작전: 명부의 분대를 같은 병종 시작 부대에 입힌다 */
function vetDeploy(n){const S=vetRoster();const used=new Set();let k=0;
  for(const e of S.roster){const u=G.units.find(x=>x.nat===n&&x.type===e.type&&!x.rid&&!used.has(x));if(!u)continue;used.add(u);
    u.rid=e.id;u.xp=e.xp;u.rank=rankOf(e.xp);u.mor=80+u.rank*5;u.vn=null;vetArr(u);
    (e.men||[]).forEach(m=>{if(m.i<u.vn.length){u.vn[m.i]=m.n;u.vk[m.i]=m.k||0;}});k++;}
  G.vetIn=k;if(k)L(`고참 분대 ${k}개가 다시 합류`);}
{const _ng=newGame;newGame=function(cfg){const g=_ng(cfg);if(typeof document!=='undefined'&&!G.scn&&!G.boot&&vetStore.on()){const h=G.order.find(i=>G.nats[i].ctrl==='human');if(h!=null)vetDeploy(h);}return g;};}
/* 작전 끝: 살아남은 숙련 이상 분대를 명부에 올린다(사람이 지휘한 일반 작전만) */
function vetEnd(){if(G._vetDone)return;G._vetDone=1;const n=G.viewer;const human=G.nats[n]&&G.nats[n].ctrl==='human';
  for(const u of G.units)if(!UT[u.type].fly)giveXp(u,VET.xp.end);
  G.vetOut=[];if(!human||G.scn)return;
  const S=vetRoster();const mine=G.units.filter(u=>u.nat===n&&!UT[u.type].fly&&(u.rank||0)>=1);
  const deployed=new Set(G.units.filter(u=>u.rid).map(u=>u.rid).concat(G.vetLost||[]));
  const keep=S.roster.filter(e=>!deployed.has(e.id));
  const out=mine.map(u=>{vetArr(u);const tot=u.vn.length;const ok=u.ws?u.ws.filter(w=>w.s==='ok'||w.s==='lw').length:tot;
    const men=vetMen(u).filter(v=>!v.kia).map(v=>({i:v.i,n:v.name,k:v.k}));
    const xp=Math.round(u.xp*(.6+.4*ok/Math.max(1,tot)));   // 빈자리는 신병이 메운다
    return {id:u.rid||('v'+Date.now().toString(36)+u.id),type:u.type,xp,men,ops:((S.roster.find(e=>e.id===u.rid)||{}).ops||0)+1};});
  G.vetOut=out;
  const fallen=(G.vetFallen||[]).filter(f=>f.nat===n).map(f=>({n:f.name,t:f.title,k:f.k,type:f.type,d:new Date().toISOString().slice(0,10)}));
  vetStore.set({roster:out.concat(keep).sort((a,b)=>b.xp-a.xp).slice(0,VET.maxRoster),fallen:fallen.concat(S.fallen).slice(0,20)});}

/* ---------- 화면 ---------- */
function vetInfo(u){if(!u.xp&&!u.rank)return '';const v=vetMen(u).filter(x=>!x.kia);const nx=VET.ranks[(u.rank||0)+1];
  return ` · ${rankName(u)} (경험 ${Math.floor(u.xp||0)}${nx?`/${nx.xp}`:''})${v.length?' · 베테랑 '+v.map(x=>vetLabel(x)+(x.able?'':'(부상)')).join(', '):''}`;}
function v3RankTag(u){const r=u.rank||0;const star=vetMen(u).some(v=>v.able);if(!r&&!star)return '';
  const ch=Array.from({length:r},(_,i)=>`<path d="M1 ${3+i*3}l4-2.4 4 2.4" />`).join('');
  return `<b class="rk" title="${rankName(u)}${star?' · 베테랑 있음':''}">${r?`<svg viewBox="0 0 10 ${3+r*3}" width="9" height="${2+r*3}" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6">${ch}</g></svg>`:''}${star?'<svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M5 .6l1.3 3 3.2.3-2.4 2.1.7 3.2L5 7.6 2.2 9.2l.7-3.2L.5 3.9l3.2-.3z" fill="currentColor"/></svg>':''}</b>`;}
const vetRow=(type,rank,xp,men,extra)=>`<tr><td style="text-align:left">${UT[type]?UT[type].n:type}</td><td>${VET.ranks[rank].n}</td><td>${Math.floor(xp)}</td><td style="text-align:left;white-space:normal">${men.length?men.join(', '):'-'}</td>${extra!=null?`<td>${extra}</td>`:''}</tr>`;
function vetPanel(){const n=G.viewer;const mine=G.units.filter(u=>u.nat===n&&((u.xp||0)>=1||vetMen(u).length)).sort((a,b)=>(b.xp||0)-(a.xp||0));let h='';
  if(mine.length)h+=`<h3>우리 분대 경험 <span class="stats">숙련 ${VET.ranks[1].xp} · 노련 ${VET.ranks[2].xp} · 정예 ${VET.ranks[3].xp}</span></h3><div class="tbl"><table><tr><th>부대</th><th>계급</th><th>경험</th><th>베테랑(개인 전과)</th></tr>`+
    mine.slice(0,10).map(u=>vetRow(u.type,u.rank||0,u.xp||0,vetMen(u).filter(v=>!v.kia).map(v=>`${vetLabel(v)} ${v.k}${v.able?'':' (부상)'}`))).join('')+`</table></div>`;
  const fl=(G.vetFallen||[]).filter(f=>f.nat===n);if(fl.length)h+=`<h3>전사한 베테랑</h3><p>${fl.map(f=>`${f.title} ${f.name} (${UT[f.type].n}, 전과 ${f.k})`).join(' · ')}</p>`;
  if(G.over&&G.vetOut)h+=G.vetOut.length?`<p>살아남은 ${G.vetOut.length}개 분대가 고참 명부에 올랐습니다. 다음 작전에서 같은 병종으로 다시 합류합니다.</p>`:(G.nats[n].ctrl==='human'&&!G.scn?'<p>이번 작전에서 명부에 오른 분대는 없습니다. 숙련 이상으로 살아남으면 다음 작전에 데려갑니다.</p>':'');
  return h;}
function vetSetupHtml(){const S=vetRoster();const on=vetStore.on();
  if(!S.roster.length&&!S.fallen.length)return `<p class="vet-empty">고참 명부가 비어 있습니다. 작전에서 숙련 이상으로 살아남은 분대가 여기에 올라 다음 작전에 함께합니다.</p>`;
  let h=`<label class="vet-on"><input type="checkbox" id="vet-on" ${on?'checked':''}> 고참 분대 데려가기 <small>일반 작전에서 같은 병종 시작 부대에 배치</small></label>`;
  if(S.roster.length)h+=`<div class="tbl"><table><tr><th>부대</th><th>계급</th><th>경험</th><th>베테랑</th><th>작전</th></tr>`+S.roster.map(e=>vetRow(e.type,rankOf(e.xp),e.xp,(e.men||[]).map(m=>`${vetTitleOf(m.i,m.k,rankOf(e.xp))} ${m.n}`),e.ops||1)).join('')+`</table></div>`;
  if(S.fallen.length)h+=`<p class="vet-fallen"><b>추모</b> ${S.fallen.slice(0,8).map(f=>`${f.t} ${f.n}`).join(' · ')}</p>`;
  return h;}
if(typeof showSetup==='function'){const _ss=showSetup;showSetup=function(){_ss();const sl=$('#setup-err');if(!sl)return;let b=$('#vet-box');
    if(!b){b=document.createElement('div');b.id='vet-box';b.className='vet-box';sl.insertAdjacentElement('beforebegin',b);
      b.addEventListener('change',e=>{if(e.target&&e.target.id==='vet-on')vetStore.setOn(e.target.checked);});}
    b.innerHTML=`<h3 class="sec">고참 명부</h3>`+vetSetupHtml();};}
if(typeof renderPanel==='function'){const _rp=renderPanel;renderPanel=function(){_rp();const p=typeof document!=='undefined'&&$('#panel');if(!p||!UI.sheet||UI.tab!=='world')return;const h=vetPanel();if(h)p.insertAdjacentHTML('beforeend',h);};}

/* ---- 06-ai.js ---- */
/* ===================== AI (실시간) ===================== */
const AI_ORDER=['spg','mortar','sniper','mg','at','rifle','eng','hmv','ifv','tank','drone'];
const unitCap=()=>({s:16,m:22,l:28}[G.size]||22);
function aiGoal(n,u,vis){let best=null,bd=1e9;
  for(const o of G.objs){if(G.map[o.r][o.c].owner===n)continue;const d=dist(u.r,u.c,o.r,o.c);if(d<bd){bd=d;best=[o.r,o.c];}}
  for(const e of vis){const d=dist(u.r,u.c,e.r,e.c)+2;if(d<bd){bd=d;best=[e.r,e.c];}}
  if(!best){const m=(N-1)/2;best=[Math.round(m),Math.round(m)];
    // 모든 거점을 가졌으면 가장 위협받는 아군 거점으로
    for(const o of G.objs){const d=Math.min(...G.units.filter(e=>e.nat!==n).map(e=>dist(e.r,e.c,o.r,o.c)),99);if(d<bd){bd=d;best=[o.r,o.c];}}}
  return best;}
function aiAtkScore(u,e,r,c,moved){const sv=u.r,sc=u.c;u.r=r;u.c=c;let s=-1;
  try{if(canHit(u,e,null,null,moved)){const d=calcDmg(u,e,false);s=d*UT[e.type].cost/hpMax(e)*1.4;if(d>=e.hp)s+=UT[e.type].cost*2.2;
      if(!UT[e.type].ind&&d<e.hp&&canHit(e,u)){s-=calcDmg(e,u,true)*UT[u.type].cost/10;}}}
  finally{u.r=sv;u.c=sc;}return s;}
function aiPosScore(u,r,c,goal,vis,n){const t=UT[u.type],x=G.map[r][c];let s=0;
  if(t.cap&&x.obj!=null&&x.owner!==n)s+=70;
  if(x.obj!=null&&x.owner===n&&t.cls==='inf')s+=vis.some(e=>dist(e.r,e.c,r,c)<=5)?14:3;
  const gd=dist(r,c,goal[0],goal[1]);
  if(t.ind||u.type==='sniper'){const near=vis.length?Math.min(...vis.map(e=>dist(e.r,e.c,r,c))):gd;s-=Math.abs(near-(t.ind?5:5))*2.2+(vis.length?0:gd*2);}
  else if(t.fly){const near=vis.length?Math.min(...vis.map(e=>dist(e.r,e.c,r,c))):gd;s-=Math.abs(near-4)*2+gd*.6;}
  else s-=gd*2.6;
  if(t.cls==='inf'){if(x.t==='bldg')s+=5+Math.min(4,x.f)*.6;else if(x.t==='rubble')s+=3;else if(x.t==='park')s+=1.2;}
  let threat=0;const sv=u.r,sc=u.c;u.r=r;u.c=c;
  for(const e of vis){const de=dist(e.r,e.c,r,c);if(de>UT[e.type].rng[1]+2)continue;if(canHit(e,u)){threat+=calcDmg(e,u,false);}

/* 실시간 AI: 1.6~2.8초마다 한 번 생각한다. 지원 → 증원 → 부대마다 다음 자리 고르기. 사격은 부대가 알아서 한다. */
function aiThink(n){const N2=G.nats[n];
  const vis=()=>G.units.filter(e=>e.nat!==n&&seen(e,n));
  // 화력 지원
  {const E=vis();if(E.length&&N2.cp>=SUP.arty.cost+2&&(N2.supT||0)<=G.time){let best=null,bs=0;
      for(const e of E)for(const [a,b] of supArea(e.r,e.c,1)){let s=0;for(const [p,q] of supArea(a,b,1)){const o=unitAt(p,q);if(!o)continue;s+=o.nat===n?-UT[o.type].cost*1.5:UT[o.type].cost;}if(s>bs){bs=s;best=[a,b];}}
      const tk=E.find(e=>e.type==='tank'&&!inside(e));
      if(tk&&N2.cp>=SUP.air.cost+3&&!WX[G.wx].noAir&&!G.units.some(o=>o.nat===n&&dist(o.r,o.c,tk.r,tk.c)<1))support(n,'air',tk.r,tk.c);
      else if(typeof aiAirSup==='function'&&aiAirSup(n,E)){}
      else if(best&&bs>=9)support(n,'arty',best[0],best[1]);}}
  // 증원
  {const E=vis();const reserve=E.length>=3&&(N2.supT||0)<=G.time?6:0;let guard=0;
    while(guard++<3&&G.units.filter(u=>u.nat===n).length<unitCap()){const mine=G.units.filter(u=>u.nat===n);const cnt=t=>mine.filter(u=>u.type===t).length;
      const eVeh=E.filter(e=>UT[e.type].cls==='veh').length;
      const w={rifle:5,mg:2,at:1.5+eVeh*2,sniper:cnt('sniper')<2?1.2:.2,eng:1,mortar:cnt('mortar')<2?1.4:.3,ifv:cnt('ifv')<2?1.2:.3,tank:N2.cp>=10&&cnt('tank')<2?2:0,drone:cnt('drone')<1?1:0,hmv:cnt('hmv')<2?1:.2,spg:N2.cp>=10&&cnt('spg')<1?1.2:0};if(typeof aiAirW==='function')Object.assign(w,aiAirW(E,cnt));
      const af=Object.keys(w).filter(t=>w[t]>0&&UT[t].cost<=N2.cp-reserve);if(!af.length)break;
      let tot=af.reduce((a,t)=>a+w[t],0),r=Math.random()*tot,pick=af[0];for(const t of af){r-=w[t];if(r<=0){pick=t;break;}}
      const sp=deploySpots(n,pick);if(!sp.length)break;const goal=aiGoal(n,{r:Math.round((N-1)/2),c:Math.round((N-1)/2)},[]);
      sp.sort((a,b)=>dist(kr(a),kc(a),goal[0],goal[1])-dist(kr(b),kc(b),goal[0],goal[1]));
      if(!buy(n,pick,kr(sp[0]),kc(sp[0])))break;}}
  // 부대 기동: 가는 중이면 대개 그대로 두고, 멈춘 부대는 다음 자리를 고른다
  const E=vis();
  for(const u of G.units){if(u.nat!==n||u.job)continue;const t=UT[u.type];if(t.heli)continue;if(t.kami&&typeof aiFpv==='function'&&aiFpv(n,u,E))continue;if(t.dteam&&E.some(e=>Math.hypot(e.x-u.x,e.z-u.z)<9)&&Math.random()<.85)continue;
    if(u.path&&u.path.length&&Math.random()<.75)continue;
    if(t.ind&&E.some(e=>canHit(u,e))&&Math.random()<.85)continue; // 곡사: 쏠 수 있으면 자리 지킴
    const goal=aiGoal(n,u,E);const R=reach(u);let bestT=key(u.r,u.c),bestS=-1e9;
    for(const k of R.keys()){const r=kr(k),c=kc(k);let s=aiPosScore(u,r,c,goal,E,n);let as=0;

      else if(k!==key(u.r,u.c))s-=3;
      s+=as*.8;if(k===key(u.r,u.c))s+=1.5;if(s>bestS){bestS=s;bestT=k;}}
    if(bestT!==key(u.r,u.c)){const [jx,jz]=coverSnap(u,kc(bestT)+.2+Math.random()*.6,kr(bestT)+.2+Math.random()*.6);u.path=pathPts(u,jx,jz);u.tgt=null;u.dest=null;}}

/* ===================== DESTRUCTION: 바닥 흔적·먼지·불·잔해 =====================
   파괴는 이 게임의 볼거리다. 한 번 맞은 자리는 그대로 남는다:

function v3CutMap(vs,vn){const m=new Map();if(!G)return m;

function v3CutTile(D,L,r,c,x,x0,x1,z0,z1,lvl,hFull,shade){const T=V3.T,k=key(r,c);const y=.06+lvl*FLOOR_H,yt=Math.min(.06+hFull,y+FLOOR_H*CUT_SILL),t=.03;
  const floorC=new T.Color('#7a7266').lerp(shade,.15),wallC=new T.Color('#c9c2b4').lerp(shade,.3),cutC=new T.Color('#5d574e'),dark=new T.Color('#1f1d1a');
  const st=v3Stair(r,c);const hx0=Math.min(st.sx,st.sx+st.ax*STAIR_L),hx1=Math.max(st.sx,st.sx+st.ax*STAIR_L),hz0=st.sz-STAIR_W,hz1=st.sz+STAIR_W;
  // 바닥: 계단실 구멍만 비우고 네 조각으로

  slab(x0,x1,z0,hz0);slab(x0,x1,hz1,z1);slab(x0,hx0,hz0,hz1);slab(hx1,x1,hz0,hz1);
  // 바닥 얼룩·타일 줄
  const tl=floorC.clone().multiplyScalar(.9);for(let i=1;i<4;i++){const zz=z0+(z1-z0)*i/4;v3DQuad(D,[x0,fy+.0005,zz-.002],[x0,fy+.0005,zz+.002],[x1,fy+.0005,zz+.002],[x1,fy+.0005,zz-.002],tl,k);}
  // 계단실: 아래층으로 내려가는 계단(구멍 속), 구멍 둘레 난간
  if(lvl>0){const n=7,dir=((lvl-1)%2===0)?1:-1;   // 짝수 층에서 출발하는 계단은 계단 자리에서 ax쪽으로 오른다
    for(let i=0;i<n;i++){const f=(i+1)/n;const hy=y-FLOOR_H*(1-f);const a=dir>0?st.sx+st.ax*STAIR_L*(i/n):st.sx+st.ax*STAIR_L*(1-(i+1)/n),b=a+st.ax*STAIR_L/n;
      v3DBox(D,Math.min(a,b),Math.max(a,b),hy-.012,hy,hz0+.004,hz1-.004,new T.Color('#8a8377').multiplyScalar(.75+.25*f),k);}
    v3DQuad(D,[hx0,y-FLOOR_H+.003,hz0],[hx0,y-FLOOR_H+.003,hz1],[hx1,y-FLOOR_H+.003,hz1],[hx1,y-FLOOR_H+.003,hz0],dark,k);}
  else v3DQuad(D,[hx0,fy+.001,hz0],[hx0,fy+.001,hz1],[hx1,fy+.001,hz1],[hx1,fy+.001,hz0],new T.Color('#4c463e'),k);
  const rl=new T.Color('#3a3631');v3DBox(D,hx0,hx1,y,y+.045,hz1,hz1+.006,rl,k);
  // 계단실 벽(한쪽)
  v3DBox(D,hx0,hx1,y,yt,hz0-.012,hz0,wallC.clone().multiplyScalar(.9),k);
  // 칸막이 벽 하나(문틈 있음)
  if(v3Hash(k,300+lvl)<.75){const vert=v3Hash(k,310+lvl)<.5;const p=.35+v3Hash(k,320+lvl)*.3,g0=.3+v3Hash(k,330+lvl)*.25;
    if(vert){const xx=x0+(x1-x0)*p;if(xx<hx0-.03||xx>hx1+.03){v3DBox(D,xx-.008,xx+.008,y,yt,z0,z0+(z1-z0)*g0,wallC,k);v3DBox(D,xx-.008,xx+.008,y,yt,z0+(z1-z0)*(g0+.2),z1,wallC,k);}}
    else{const zz=z0+(z1-z0)*p;if(zz<hz0-.03||zz>hz1+.03){v3DBox(D,x0,x0+(x1-x0)*g0,y,yt,zz-.008,zz+.008,wallC,k);v3DBox(D,x0+(x1-x0)*(g0+.2),x1,y,yt,zz-.008,zz+.008,wallC,k);}}}
  // 가구 몇 개(넘어진 책상·매트리스)
  for(let i=0;i<3;i++)if(v3Hash(k,340+i+lvl*7)<.6){const px=x0+.08+(x1-x0-.16)*v3Hash(k,350+i+lvl*7),pz=z0+.08+(z1-z0-.16)*v3Hash(k,360+i+lvl*7);if(px>hx0-.06&&px<hx1+.06&&pz>hz0-.06&&pz<hz1+.06)continue;
    const w=.03+v3Hash(k,370+i)*.04;v3DBox(D,px-w,px+w,y,y+.012+v3Hash(k,380+i)*.02,pz-.025,pz+.025,new T.Color(['#5b5248','#6d6a63','#4a4f52'][i]),k);}
  // 안쪽 벽면과 벽 단면(두께)
  const inner=(ax,az,bx,bz,nx,nz)=>{v3DQuad(D,[ax+nx*t,y,az+nz*t],[bx+nx*t,y,bz+nz*t],[bx+nx*t,yt,bz+nz*t],[ax+nx*t,yt,az+nz*t],wallC,k);
    v3DQuad(D,[ax,yt,az],[bx,yt,bz],[bx+nx*t,yt,bz+nz*t],[ax+nx*t,yt,az+nz*t],cutC,k);};
  inner(x0,z0,x1,z0,0,1);inner(x1,z1,x0,z1,0,-1);inner(x0,z1,x0,z0,1,0);inner(x1,z0,x1,z1,-1,0);
  // 창 자리: 벽 단면 위에 짧은 기둥(창틀)
  const pc=new T.Color('#8e877b');for(const [ax,az,bx,bz,nx,nz] of [[x0,z0,x1,z0,0,1],[x0,z1,x1,z1,0,-1],[x0,z0,x0,z1,1,0],[x1,z0,x1,z1,-1,0]]){const len=Math.hypot(bx-ax,bz-az),n=Math.max(2,Math.round(len/.21));
    for(let i=0;i<=n;i++){const f=i/n,px=ax+(bx-ax)*f,pz=az+(bz-az)*f;v3DBox(D,px-.01+nx*.0,px+.01+nx*t,yt,yt+.02,pz-.01,pz+.01+nz*t,pc,k);}}
  // 잘린 위쪽: 옅은 윤곽선
  const top=.06+hFull;if(top>yt+.02){for(const [a,b] of [[x0,z0],[x1,z0],[x1,z1],[x0,z1]])L.push(a,yt,b,a,top,b);
    for(const yy of [top])for(const [a,b,c2,d] of [[x0,z0,x1,z0],[x1,z0,x1,z1],[x1,z1,x0,z1],[x0,z1,x0,z0]])L.push(a,yy,b,c2,yy,d);
    for(let f=lvl+2;f<x.f;f++){const yy=.06+f*FLOOR_H;if(yy>=top)break;for(const [a,b,c2,d] of [[x0,z0,x1,z0],[x1,z0,x1,z1],[x1,z1,x0,z1],[x0,z1,x0,z0]])L.push(a,yy,b,c2,yy,d);}}}
/* 출입문: 바깥 벽면에 어두운 문, 문틀, 작은 차양 */
function v3Doors(D,r,c,x0,x1,z0,z1,dmg){const ds=doorSides(r,c);if(!ds)return;const T=V3.T,k=key(r,c);const dk=new T.Color('#191714'),fr=new T.Color('#4a453d'),cn=new T.Color('#7d776d');
  const w=.055,h=.17,o=.004,y0=.06;
  for(let s=0;s<4;s++){if(!ds[s])continue;const [dx,dz]=doorPos(r,c,s);
    if(s===0||s===2){const z=s===0?z0-o:z1+o,sg=s===0?-1:1;
      v3DBox(D,dx-w-.012,dx+w+.012,y0,y0+h+.012,Math.min(z,z-sg*o),Math.max(z,z-sg*o)+.001,fr,k);
      v3DQuad(D,[dx-w,y0,z+sg*.001],[dx+w,y0,z+sg*.001],[dx+w,y0+h,z+sg*.001],[dx-w,y0+h,z+sg*.001],dk,k);
      if(dmg<.4)v3DBox(D,dx-w-.03,dx+w+.03,y0+h+.02,y0+h+.032,Math.min(z,z+sg*.06),Math.max(z,z+sg*.06),cn,k);
      v3DBox(D,dx-w-.02,dx+w+.02,0,y0+.012,Math.min(z,z+sg*.05),Math.max(z,z+sg*.05),cn,k);}
    else{const x=s===3?x0-o:x1+o,sg=s===3?-1:1;
      v3DBox(D,Math.min(x,x-sg*o),Math.max(x,x-sg*o)+.001,y0,y0+h+.012,dz-w-.012,dz+w+.012,fr,k);
      v3DQuad(D,[x+sg*.001,y0,dz+w],[x+sg*.001,y0,dz-w],[x+sg*.001,y0+h,dz-w],[x+sg*.001,y0+h,dz+w],dk,k);
      if(dmg<.4)v3DBox(D,Math.min(x,x+sg*.06),Math.max(x,x+sg*.06),y0+h+.02,y0+h+.032,dz-w-.03,dz+w+.03,cn,k);
      v3DBox(D,Math.min(x,x+sg*.05),Math.max(x,x+sg*.05),0,y0+.012,dz-w-.02,dz+w+.02,cn,k);}}}
function v3FloorMesh(g,D,L){const T=V3.T;
  if(D.P.length){const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(D.P,3));geo.setAttribute('color',new T.Float32BufferAttribute(D.C,3));geo.computeVertexNormals();
    const m=new T.Mesh(geo,V3.M.inner||(V3.M.inner=new T.MeshStandardMaterial({vertexColors:true,roughness:.95,side:T.DoubleSide})));m.castShadow=m.receiveShadow=true;m.userData.tri=D.K;g.add(m);}
  if(L.length){const lg=new T.BufferGeometry();lg.setAttribute('position',new T.Float32BufferAttribute(L,3));
    g.add(new T.LineSegments(lg,V3.M.ghost||(V3.M.ghost=new T.LineBasicMaterial({color:'#e8e2d4',transparent:true,opacity:.28,depthWrite:false}))));}}
/* 건물 안 보병의 높이: 지금 층 바닥 */
function v3InY(u){const x=cell(u.r,u.c);if(UT[u.type].cls!=='inf'||x.t!=='bldg')return null;const f=u.fl!=null&&u.flK===key(u.r,u.c)?u.fl:topFl(x);return .06+Math.min(f,bldgH(x))*FLOOR_H+.005;}
/* 건물 안 병사 한 명이 갈 자리 {x,z,y(부대 바닥 기준 높이)}. null이면 평소 대형.
   계단으로 가는 중: 한 줄로 뒤따른다(trail). 계단 위: 한 줄로 계단을 타고(앞사람부터) 오르내린다.
   멈춰 있으면 쏘는 쪽 창가(옥상이면 난간)에 붙는다. */
function v3InSoldier(uu,s,i,dt){const x=cell(uu.r,uu.c);if(UT[uu.type].cls!=='inf'||x.t!=='bldg')return null;
  const k=key(uu.r,uu.c);const ufl=uu.fl!=null&&uu.flK===k?uu.fl:roofFl(x);const st=v3Stair(uu.r,uu.c);const moving=uu.path&&uu.path.length;
  if(uu.climb&&!uu.onSt)return {trail:1,y:0};
  if(uu.climb){const dir=uu.flDir||1;const sf=Math.max(0,Math.min(roofFl(x),ufl-dir*i*.16));const fr=sf-Math.floor(sf),even=Math.floor(sf)%2===0;const p=even?fr:1-fr;
    return {x:st.sx+st.ax*STAIR_L*p,z:st.sz+(i%2?.025:-.025),y:(sf-ufl)*FLOOR_H,stair:1};}
  if(moving)return null;
  const fa=(uu.face||0)*Math.PI/180,fx=Math.cos(fa),fz=Math.sin(fa);const n=(SQUAD[uu.type]||4);
  const ax=Math.abs(fx)>Math.abs(fz);const cx=uu.c+.5,cz=uu.r+.5;const lat=(i-(n-1)/2)/Math.max(1,n-1)*.62;let gx,gz;
  if(ax){gx=cx+Math.sign(fx)*.31;gz=cz+lat;}else{gz=cz+Math.sign(fz)*.31;gx=cx+lat;}
  if(i>=6){gx=cx+(v3Hash(uu.id,90+i)-.5)*.4;gz=cz+(v3Hash(uu.id,95+i)-.5)*.4;}
  return {x:gx,z:gz,y:0};}

/* ===================== 3D: 설치형 방어물 =====================
   G.forts(04d-fort.js)를 그린다. 짓는 중에는 낮게 솟아오르고, 부서지면 먼지와 파편이 튄다.
   - 모래주머니: 엇갈려 쌓은 자루 3단
   - 철조망: 말뚝 + 코일 세 줄(아래 둘, 위 하나)
   - 콘크리트 방벽: 저지 블록(소품 방벽과 같은 단면)
   - 대전차 장애물: 철골 세 개를 엇갈려 붙인 고슴도치
   로컬 x축 = 방어물 길이 방향 (04d inBox와 같은 회전 규칙) */
function v3FortMats(){if(V3.fm)return V3.fm;const T=V3.T;
  return V3.fm={
    bag:new T.MeshStandardMaterial({color:'#a08f6c',roughness:1,flatShading:true}),
    wire:new T.MeshStandardMaterial({color:'#4a4943',roughness:.6,metalness:.5}),
    post:new T.MeshStandardMaterial({color:'#4b3d2c',roughness:1}),
    conc:new T.MeshStandardMaterial({color:'#8f8a80',roughness:1,flatShading:true}),
    steel:new T.MeshStandardMaterial({color:'#5b4334',roughness:.8,metalness:.35,flatShading:true}),
    pit:new T.MeshStandardMaterial({color:'#2e2720',roughness:1}),
    berm:new T.MeshStandardMaterial({color:'#6e5e47',roughness:1,flatShading:true}),
    plank:new T.MeshStandardMaterial({color:'#5a4632',roughness:1}),
    ghost:new T.MeshBasicMaterial({color:'#e8e2d0',transparent:true,opacity:.35,depthWrite:false})};}
function v3FortGeos(){if(V3.fg)return V3.fg;const T=V3.T,m=MU;
  const tor=new T.TorusGeometry(.42*m,.045*m,3,9).rotateY(Math.PI/2);
  const beam=new T.BoxGeometry(2.1*m,.16*m,.16*m);
  return V3.fg={bag:new T.BoxGeometry(.62*m,.24*m,.4*m),tor,post:new T.CylinderGeometry(.05*m,.06*m,1.3*m,4),beam,
    jersey:v3Prism([[-.3*m,0],[.3*m,0],[.1*m,.35*m],[.08*m,.8*m],[-.08*m,.8*m],[-.1*m,.35*m]],FORT.jersey.len).rotateY(Math.PI/2)};}
function v3FortMesh(f){const T=V3.T,m=MU,M=v3FortMats(),Gx=v3FortGeos(),d=FORT[f.k];const g=new T.Group();const R=mulberry(f.id*977+3);
  const add=(geo,mat,x,y,z,rx,ry,rz)=>{const o=new T.Mesh(geo,mat);o.position.set(x,y,z);o.rotation.set(rx||0,ry||0,rz||0);o.castShadow=true;o.receiveShadow=true;g.add(o);return o;};
  if(f.k==='sandbag'){const L=d.len,n=Math.max(3,Math.round(L/(.6*m)));
    for(let row=0;row<3;row++){const cnt=row===2?n-1:n,sh=(row===1?.25:row===2?.5:0)*L/n;
      for(let i=0;i<cnt;i++){const x=-L/2+(i+.5)*L/n+sh;
        for(const zz of row<2?[-.2*m,.2*m]:[0])add(Gx.bag,M.bag,x+(R()-.5)*.08*m,(.12+row*.22)*m,zz+(R()-.5)*.06*m,0,(R()-.5)*.25,(R()-.5)*.08);}}}
  else if(f.k==='wire'){const L=d.len,n=Math.round(L/(.22*m));
    for(const [zz,yy] of [[-.38*m,.42*m],[.38*m,.42*m],[0,1.05*m]])for(let i=0;i<n;i++)add(Gx.tor,M.wire,-L/2+(i+.5)*L/n,yy,zz,(R()-.5)*.5,(R()-.5)*.3,0);
    for(const s of [-.5,0,.5])add(Gx.post,M.post,s*L*.9,.65*m,0,(R()-.5)*.15,0,(R()-.5)*.15);}
  else if(f.k==='jersey')add(Gx.jersey,M.conc,0,0,0);
  else if(f.k==='trench'){// 파인 바닥 + 판자 벽 + 양옆으로 퍼낸 흙둔덕. 가운데에서 살짝 꺾여 지그재그로
    const L=d.len,W=d.w;for(const [sx,a] of [[-L/4,.22],[L/4,-.22]]){const s=new T.Group();s.position.set(sx,0,0);s.rotation.y=a;g.add(s);
      const o=new T.Mesh(new T.BoxGeometry(L/2+.03,.004,W*.62),M.pit);o.position.y=.003;o.receiveShadow=true;s.add(o);
      for(const zz of [-1,1]){const p=new T.Mesh(new T.BoxGeometry(L/2+.02,.35*m,.08*m),M.plank);p.position.set(0,.16*m,zz*W*.31);p.castShadow=true;s.add(p);
        const b=new T.Mesh(new T.BoxGeometry(L/2+.05,.5*m,W*.32),M.berm);b.position.set(0,.2*m,zz*W*.62);b.rotation.x=zz*.18;b.castShadow=true;b.receiveShadow=true;s.add(b);}}}
  else if(f.k==='nest'){// 반원형 모래주머니 2단, 열린 쪽(로컬 +z)이 뒤
    const R0=.12;for(let row=0;row<3;row++){const n=row===2?7:8;for(let i=0;i<n;i++){const a=-1.75+(i+(row%2?.5:0)+.5)/n*3.5;const x=Math.sin(a)*R0,z=-Math.cos(a)*R0;
      add(Gx.bag,M.bag,x,(.12+row*.22)*m,z,0,-a+(R()-.5)*.15,(R()-.5)*.08);}}}
  else if(f.k==='hedgehog'){const h=new T.Group();for(const [rx,ry,rz] of [[0,0,0],[0,Math.PI/2,0],[0,0,Math.PI/2]]){const o=new T.Mesh(Gx.beam,M.steel);o.rotation.set(rx,ry,rz);o.castShadow=true;h.add(o);}
    h.rotation.set(.615,R()*Math.PI,.785);h.position.y=.78*m;g.add(h);}
  g.position.set(f.x,0,f.z);g.rotation.y=f.ry;return g;}
/* 매 프레임: 새로 생긴 방어물을 만들고, 짓는 정도를 높이로 보여 주고, 사라진 것은 지운다 */
function v3FortFrame(){if(!G||!V3.T)return;const T=V3.T;
  if(!V3.fortGrp){V3.fortGrp=new T.Group();V3.scene.add(V3.fortGrp);V3.fortObj=new Map();}
  if(V3.fortOf!==G){for(const o of V3.fortObj.values())V3.fortGrp.remove(o);V3.fortObj.clear();V3.fortOf=G;}
  const live=new Set();
  for(const f of G.forts||[]){live.add(f.id);let o=V3.fortObj.get(f.id);if(!o){o=v3FortMesh(f);V3.fortObj.set(f.id,o);V3.fortGrp.add(o);}
    const k=f.prog>=1?1:.12+.88*f.prog;if(Math.abs(o.scale.y-k)>.002){o.scale.y=k;}
    // 안개 속 적 방어물은 짓는 중일 때 보이지 않는다(다 지으면 지형처럼 보인다)
    o.visible=!(G.fog&&f.nat!==G.viewer&&f.prog<1);}
  for(const [id,o] of V3.fortObj)if(!live.has(id)){V3.fortGrp.remove(o);V3.fortObj.delete(id);}}
FXH.fortGone=function(f,why){if(typeof V3==='undefined'||!V3.on)return;try{
  if(typeof dsDust==='function')dsDust(f.x,f.z,why==='blast'?.7:.4,1600,why==='blast'?8:4,f.k==='sandbag'?'#a39370':'#8a847a');
  if(typeof v3Debris==='function')v3Debris(f.x,.05,f.z,why==='blast'?10:5,.6);}catch(e){}};

function v3HoleTex(){if(V3.holeTex)return V3.holeTex;const T=V3.T;const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const R=mulberry(77);
  const blob=(cx,cy,rad,col,n)=>{g.fillStyle=col;g.beginPath();for(let i=0;i<=n;i++){const a=i/n*6.283,rr=rad*(.65+R()*.5);const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y);}g.fill();};
  const gr=g.createLinearGradient(0,64,0,0);gr.addColorStop(0,'rgba(20,18,16,0)');gr.addColorStop(.45,'rgba(20,18,16,.55)');gr.addColorStop(1,'rgba(20,18,16,0)');g.fillStyle=gr;g.beginPath();g.ellipse(32,22,22,22,0,0,6.283);g.fill();   // 그을음

function v3HolesSync(){const H=G.holes||[];const sig=H.length+':'+V3.seed+':'+G.ver;if(V3.holeSig===sig)return;

function v3FireBuild(k){const T=V3.T;const r=kr(k),c=kc(k);const X=G.map[r][c];const b=bldgBox(r,c);const g=new T.Group();const q=1e-6;const F=[];

/* ===================== 도시 소품 =====================
   지금 시대 도시 느낌을 내는 소품들. 모두 칸 좌표와 v3Hash로 정해서, 같은 지도면 언제나 같은 자리에 놓인다.
   - v3BuildProps(g): 지면 그룹에 주차된 차(SUV·세단·픽업, 일부는 불탐), 신호등, 가로등, 공원(나무·벤치·산책로 등), 연못
   - v3BuildShops(g): 건물 그룹에 1층 상가(유리 진열창, 차양, 간판). 건물이 부서지면 다시 그려진다. */

function v3PropMats(){if(V3.pm)return V3.pm;const T=V3.T;
  const pm={
    car:new T.MeshStandardMaterial({color:'#ffffff',roughness:.45,metalness:.35}),
    glass:new T.MeshStandardMaterial({color:'#20282d',roughness:.2,metalness:.6}),
    tire:new T.MeshStandardMaterial({color:'#1b1b1a',roughness:.95}),
    pole:new T.MeshStandardMaterial({color:'#4a4c4c',roughness:.6,metalness:.5}),
    sig:new T.MeshStandardMaterial({color:'#1d1f1f',roughness:.7}),
    lamp:new T.MeshStandardMaterial({color:'#000',emissive:'#ffffff',emissiveIntensity:1.4}),
    leaf:new T.MeshStandardMaterial({color:'#ffffff',roughness:1,flatShading:true}),
    bark:new T.MeshStandardMaterial({color:'#4a3d30',roughness:1}),
    wood:new T.MeshStandardMaterial({color:'#6b5843',roughness:.9}),
    hedge:new T.MeshStandardMaterial({color:'#47513a',roughness:1,flatShading:true}),
    path:new T.MeshStandardMaterial({color:'#9a9283',roughness:1}),
    conc:new T.MeshStandardMaterial({color:'#8f8a80',roughness:1,flatShading:true}),
    bin:new T.MeshStandardMaterial({color:'#3f5143',roughness:.8,metalness:.3}),
    water:new T.MeshStandardMaterial({color:'#33464c',roughness:.08,metalness:.55}),
    stone:new T.MeshStandardMaterial({color:'#8c877d',roughness:1,flatShading:true}),
    reed:new T.MeshStandardMaterial({color:'#6b6a48',roughness:1,flatShading:true}),
    shop:new T.MeshStandardMaterial({color:'#ffffff',roughness:.25,metalness:.5}),
    awn:new T.MeshStandardMaterial({color:'#ffffff',roughness:.9,side:T.DoubleSide}),
    sign:new T.MeshStandardMaterial({color:'#ffffff',roughness:.6,emissive:'#ffffff',emissiveIntensity:0}),
  };
  for(const k in pm)if(k!=='lamp')v3FowMat(pm[k]);
  V3.pm=pm;return pm;}

/* 인스턴스 묶음: 같은 형상을 여러 자리에 한 번에 그린다 */
function v3Inst(g,geo,mat,list,opt){if(!list.length)return null;const T=V3.T;const im=new T.InstancedMesh(geo,mat,list.length);
  const m4=new T.Matrix4(),q=new T.Quaternion(),p=new T.Vector3(),s=new T.Vector3(),e=new T.Euler(0,0,0,'YXZ'),c=new T.Color();
  list.forEach((it,i)=>{p.set(it.x,it.y||0,it.z);e.set(it.rx||0,it.ry||0,it.rz||0);q.setFromEuler(e);const k=it.s??1;s.set(it.sx??k,it.sy??k,it.sz??k);m4.compose(p,q,s);im.setMatrixAt(i,m4);
    if(it.col)im.setColorAt(i,c.set(it.col));});
  im.castShadow=!(opt&&opt.noShadow);im.receiveShadow=true;if(opt&&opt.keys)im.userData.keys=list.map(it=>it.k);g.add(im);return im;}

/* ---------- 차 ---------- */
// 옆모습 두 개(차체, 유리칸)와 지붕판으로 차 한 대를 이룬다. 앞이 +x.
const CAR_KINDS={
  suv:{body:[[-2.45,.35],[2.45,.35],[2.45,.9],[1.6,1.05],[-2.45,1.05]],cab:[[-2.3,1.05],[1.4,1.05],[.8,1.75],[-2.3,1.75]],w:1.95},
  sedan:{body:[[-2.35,.3],[2.35,.3],[2.35,.75],[1.2,.85],[-2.35,.85]],cab:[[-1.5,.85],[1.0,.85],[.3,1.42],[-1.1,1.42]],w:1.82},
  pickup:{body:[[-2.8,.42],[2.8,.42],[2.8,1.0],[1.9,1.12],[-2.8,1.12]],cab:[[-.4,1.12],[1.7,1.12],[1.1,1.85],[-.4,1.85]],w:2.0},
};
function v3CarGeos(){if(V3.carG)return V3.carG;const m=MU;const out={};
  for(const k in CAR_KINDS){const d=CAR_KINDS[k];const sc=pts=>pts.map(([x,y])=>[x*m,y*m]);
    const top=d.cab[3][1],x0=d.cab[3][0]+.05,x1=d.cab[2][0]-.05;
    out[k]={body:v3Prism(sc(d.body),d.w*m),cab:v3Prism(sc(d.cab),(d.w-.12)*m),
      roof:new V3.T.BoxGeometry((x1-x0)*m,.06*m,(d.w-.32)*m).translate((x0+x1)/2*m,(top+.03)*m,0)};}
  out.wheel=new V3.T.CylinderGeometry(.34*MU,.34*MU,.24*MU,6).rotateX(Math.PI/2);
  V3.carG=out;return out;}

function v3BuildProps(g){const T=V3.T,pm=v3PropMats(),m=MU;
  if(!G.props)propCovers();const PR=G.props||[];
  /* 주차된 차: 인도 쪽 갓길에 나란히(자리는 genProps가 정함). 일부는 불타 검게 그을리고, 몇 대는 뒤집혀 있다 */
  const cars={suv:{b:[],c:[],r:[]},sedan:{b:[],c:[],r:[]},pickup:{b:[],c:[],r:[]}},wheels=[];
  for(const p of PR){if(p.k!=='car')continue;const {kind,x,z,ry,burnt,flip,col}=p;
    const fy=flip?(CAR_KINDS[kind].cab[2][1]+.05)*m:0,rx=flip?Math.PI:0;
    cars[kind].b.push({x,y:fy,z,ry,rx,col});if(!burnt)cars[kind].r.push({x,z,ry,col});cars[kind].c.push({x,y:fy,z,ry,rx,col:burnt?'#1a1816':'#ffffff'});
    if(!burnt&&!p.lot){const L=CAR_KINDS[kind].body[1][0]*.62*m,W=CAR_KINDS[kind].w*.5*m,cs=Math.cos(ry),sn=Math.sin(ry);
      for(const [fx,fz] of [[1,1],[1,-1],[-1,1],[-1,-1]]){const lx=fx*L,lz=fz*W;wheels.push({x:x+lx*cs+lz*sn,y:.34*m,z:z-lx*sn+lz*cs,ry});}}}
  const cg=v3CarGeos();
  for(const kind in cars){v3Inst(g,cg[kind].body,pm.car,cars[kind].b);v3Inst(g,cg[kind].cab,pm.glass,cars[kind].c);v3Inst(g,cg[kind].roof,pm.car,cars[kind].r);}
  v3Inst(g,cg.wheel,pm.tire,wheels,{noShadow:1});
  /* 신호등: 기둥 + 도로 위로 뻗은 팔 + 신호기 두 개 */
  {const pole=[],arm=[],head=[],lit=[];
    for(const s of PR){if(s.k!=='light')continue;const ry=Math.atan2(-s.dz,s.dx);
      pole.push({x:s.x,y:3*m,z:s.z});
      arm.push({x:s.x+s.dx*2.2*m,y:5.6*m,z:s.z+s.dz*2.2*m,ry});
      for(const f of [2.4,4.2]){const hx=s.x+s.dx*f*m,hz=s.z+s.dz*f*m;head.push({x:hx,y:5.1*m,z:hz,ry});
        lit.push({x:hx,y:4.75*m+(s.red?.6*m:0),z:hz,col:s.red?'#ff3b2f':'#3cff8a'});}}
    v3Inst(g,new T.CylinderGeometry(.09*m,.12*m,6*m,6),pm.pole,pole);
    v3Inst(g,new T.BoxGeometry(4.4*m,.12*m,.12*m),pm.pole,arm);
    v3Inst(g,new T.BoxGeometry(.4*m,1.2*m,.4*m),pm.sig,head);
    const lm=V3.litM||(V3.litM=new T.MeshBasicMaterial({color:'#ffffff'}));v3Inst(g,new T.SphereGeometry(.17*m,6,4),lm,lit,{noShadow:1});}
  /* 가로등 */
  {const pole=[],head=[];for(const l of PR){if(l.k!=='lamp')continue;pole.push({x:l.x,y:4*m,z:l.z});head.push({x:l.x,y:8*m,z:l.z,ry:l.ry});}
    v3Inst(g,new T.CylinderGeometry(.07*m,.1*m,8*m,5),pm.pole,pole);
    v3Inst(g,new T.BoxGeometry(1.2*m,.18*m,.35*m).translate(.6*m,0,0),pm.pole,head);}
  /* 콘크리트 방벽(저지 블록), 쓰레기 컨테이너, 생울타리 */
  {const bar=[],bin=[],lid=[],hedge=[];
    for(const p of PR){if(p.k==='barrier')bar.push({x:p.x,z:p.z,ry:p.ry});else if(p.k==='bin'){bin.push({x:p.x,y:.7*m,z:p.z,ry:p.ry});lid.push({x:p.x,y:1.45*m,z:p.z,ry:p.ry,rz:.08});}
      else if(p.k==='hedge')hedge.push({x:p.x,y:.5*m,z:p.z,ry:p.ry});}
    v3Inst(g,v3Prism([[-.3*m,0],[.3*m,0],[.1*m,.35*m],[.08*m,.8*m],[-.08*m,.8*m],[-.1*m,.35*m]],3.2*m).rotateY(Math.PI/2),pm.conc,bar);
    v3Inst(g,new T.BoxGeometry(1.0*m,1.4*m,1.9*m),pm.bin,bin);v3Inst(g,new T.BoxGeometry(1.1*m,.1*m,2.0*m),pm.sig,lid,{noShadow:1});
    v3Inst(g,new T.BoxGeometry(12*m,1*m,.9*m),pm.hedge,hedge);}
  v3BuildPark(g);v3BuildPonds(g);}

/* ---------- 공원 ---------- */
// 잎이 달린 나무: 몇 개의 각진 덩어리를 겹쳐 한 형상으로
function v3LeafTreeG(){if(V3.leafG)return V3.leafG;const T=V3.T;const parts=[];const R=mulberry(41);
  for(let i=0;i<4;i++){const s=(.9+R()*.6)*MU*2.2;const g=new T.IcosahedronGeometry(s,0);g.translate((R()-.5)*2.2*MU,7*MU+R()*2*MU,(R()-.5)*2.2*MU);parts.push(g.toNonIndexed());}
  let n=0;for(const g of parts)n+=g.attributes.position.count;const P=new Float32Array(n*3);let o=0;for(const g of parts){P.set(g.attributes.position.array,o);o+=g.attributes.position.array.length;g.dispose();}
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.BufferAttribute(P,3));geo.computeVertexNormals();V3.leafG=geo;return geo;}
function v3BuildPark(g){const T=V3.T,pm=v3PropMats(),m=MU;
  const park=(r,c)=>inb(r,c)&&!G.map[r][c].yard&&(G.map[r][c].t==='park'||G.map[r][c].t==='water');
  const trees=[],trunks=[],bench=[],paths=[],plamp=[];const LEAF=['#6e6a4c','#7a7353','#5f5d43','#76704f','#665f45'];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(G.map[r][c].t!=='park')continue;const k=key(r,c);const [cx,cz]=v3x(r,c);
    // 산책로: 이웃 공원 칸으로 이어지는 흙길, 칸 가운데서 만난다
    const yard=G.map[r][c].yard;// 주택 마당은 길·벤치 없이 나무만
    const nb=yard?[]:[[0,1],[1,0]].filter(([a,b])=>park(r+a,c+b));
    if(!yard&&(nb.length||v3Hash(k,400)<.5)){paths.push({x:cx,y:.004,z:cz,sx:1,sz:1,ry:0,k,disc:1});
      for(const [a,b] of nb)paths.push({x:cx+b*.5,y:.003,z:cz+a*.5,ry:b?0:Math.PI/2,k});}
    for(let i=0;i<2;i++)if(v3Hash(k,410+i)<.3){const a=v3Hash(k,420+i)*6.28,rr=.26+v3Hash(k,430+i)*.16;const x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr,s=.8+v3Hash(k,440+i)*.5;
      trees.push({x,y:0,z,s,ry:v3Hash(k,450+i)*6.28,col:LEAF[Math.floor(v3Hash(k,460+i)*LEAF.length)],k});trunks.push({x,y:3.5*m*s,z,s});}
    if(yard)continue;
    if(v3Hash(k,470)<.45){const side=v3Hash(k,471)<.5;bench.push({x:cx+(side?.12:0),y:.25*m,z:cz+(side?0:.12),ry:side?Math.PI/2:0});}
    if(v3Hash(k,480)<.25)plamp.push({x:cx-.1,y:2*m,z:cz-.1});}
  v3Inst(g,v3LeafTreeG(),pm.leaf,trees,{keys:1});
  v3Inst(g,new T.CylinderGeometry(.18*m,.25*m,7*m,5),pm.bark,trunks);
  // 산책로: 칸 가운데 둥근 마당 + 이웃으로 뻗는 길
  {const disc=paths.filter(p=>p.disc).map(p=>({...p,rx:-Math.PI/2})),lane=paths.filter(p=>!p.disc).map(p=>({...p,rx:-Math.PI/2}));
    v3Inst(g,new T.CircleGeometry(.16,14),pm.path,disc,{noShadow:1});v3Inst(g,new T.PlaneGeometry(1,.06),pm.path,lane,{noShadow:1});}
  v3Inst(g,new T.BoxGeometry(1.8*m,.5*m,.6*m),pm.wood,bench);
  v3Inst(g,new T.CylinderGeometry(.06*m,.08*m,4*m,5),pm.pole,plamp);}

/* ---------- 연못 ---------- */
// 물 칸마다 울퉁불퉁한 원형 수면, 돌 테두리, 갈대 몇 무더기. 붙은 물 칸끼리는 수면이 겹쳐 하나로 보인다.
function v3BuildPonds(g){const T=V3.T,pm=v3PropMats(),m=MU;const stones=[],reeds=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(G.map[r][c].t!=='water')continue;const k=key(r,c);const [cx,cz]=v3x(r,c);
    const wet=(a,b)=>inb(r+a,c+b)&&G.map[r+a][c+b].t==='water';
    const S=40,pts=[];for(let i=0;i<S;i++){const a=i/S*Math.PI*2;const dx=Math.cos(a),dz=Math.sin(a);
      // 물 칸 쪽으로는 칸 끝까지 뻗어 이웃 수면과 이어진다
      const toward=(dx>.6&&wet(0,1))||(dx<-.6&&wet(0,-1))||(dz>.6&&wet(1,0))||(dz<-.6&&wet(-1,0));
      const rr=toward?.62:.38+Math.sin(a*3+v3Hash(k,500)*6)*.035+Math.sin(a*5+v3Hash(k,501)*6)*.02;pts.push([dx*rr,dz*rr,toward]);}
    const sh=new T.Shape();pts.forEach(([x,z],i)=>i?sh.lineTo(x,-z):sh.moveTo(x,-z));sh.closePath();
    const wg=new T.ShapeGeometry(sh);wg.rotateX(-Math.PI/2);const w=new T.Mesh(wg,pm.water);w.position.set(cx,.012,cz);w.receiveShadow=true;g.add(w);
    pts.forEach(([x,z,toward],i)=>{if(toward||i%2)return;{const sz=(.25+v3Hash(k,510+i)*.3)*m*1.6;stones.push({x:cx+x*1.04,y:.006,z:cz+z*1.04,s:sz,sy:sz*.45,ry:v3Hash(k,520+i)*6});}});
    for(let i=0;i<3;i++){if(v3Hash(k,530+i)<.35)continue;const a=v3Hash(k,540+i)*6.28;const rr=.34;
      for(let j=0;j<5;j++)reeds.push({x:cx+Math.cos(a)*rr+(v3Hash(k,550+i*5+j)-.5)*.06,y:.6*m,z:cz+Math.sin(a)*rr+(v3Hash(k,560+i*5+j)-.5)*.06,rx:(v3Hash(k,570+j)-.5)*.4,rz:(v3Hash(k,580+j)-.5)*.4});}}
  v3Inst(g,new T.DodecahedronGeometry(1,0),pm.stone,stones);
  v3Inst(g,new T.ConeGeometry(.06*m,1.3*m,3),pm.reed,reeds,{noShadow:1});}

/* ---------- 1층 상가 ---------- */
const SHOP_AWN=['#3f4a3a','#5a2e2a','#283548','#7a6a4c','#5d5f5f','#6b4a2e','#8a8476'];
const SHOP_SIGN=['#d8d2c2','#c9b26a','#9c3b2f','#2f4a63','#e0ddd5','#3a3a3a','#b46a2c'];
function v3BuildShops(g){const T=V3.T,pm=v3PropMats(),m=MU,IN=.08,y0=.06;const glass=[],awn=[],sign=[],door=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=G.map[r][c];if(x.t!=='bldg'||x.lm||x.dist==='res'||x._ch)continue;const dmg=1-x.bhp/x.bmax;if(dmg>=.4)continue;const k=key(r,c);const [cx,cz]=v3x(r,c);
    for(const [a,b,si] of [[-1,0,0],[1,0,1],[0,-1,2],[0,1,3]]){if(!inb(r+a,c+b)||G.map[r+a][c+b].t!=='road'||G.map[r+a][c+b].al)continue;if(v3Hash(k,600+si)<.3)continue;
      const d=.5-IN+.004;const fx=cx+b*d,fz=cz+a*d;const ry=b?Math.PI/2:0;const W=.82;
      // 바깥을 향한 단위벡터 (a,b) → 월드 (b,a)
      glass.push({x:fx,y:y0+.1,z:fz,ry,sx:W,sy:.17,sz:.01,col:H2(k,si)<.15?'#3b3530':'#ffffff'});
      if(dmg<.2&&v3Hash(k,610+si)<.75){const col=SHOP_AWN[Math.floor(v3Hash(k,620+si)*SHOP_AWN.length)];
        awn.push({x:fx+b*.035,y:y0+.215,z:fz+a*.035,ry,rx:(a+b)*.5,sx:W*.94,sy:.005,sz:.08,col});}
      sign.push({x:fx+b*.006,y:y0+.27,z:fz+a*.006,ry,sx:W*(.5+v3Hash(k,630+si)*.4),sy:.045,sz:.012,col:SHOP_SIGN[Math.floor(v3Hash(k,640+si)*SHOP_SIGN.length)]});}}
  function H2(k,s){return v3Hash(k,650+s);}
  const box=new T.BoxGeometry(1,1,1);
  v3Inst(g,box,pm.shop,glass,{noShadow:1});v3Inst(g,box,pm.awn,awn);v3Inst(g,box,pm.sign,sign,{noShadow:1});}

/* ---- 07r-radio.js ---- */
/* ===================== 3D·화면: 무전 지연 =====================
   05j-radio의 교신 대기열을 보여 준다(내 편만).
   - 아직 닿지 않은 명령: 부대에서 목적지까지 노란 점선, 목적지에 작은 마름모.
   - 재밍으로 끊긴 명령: 주황 점선. 이름표에 '무전 1.2'·'두절'·'전령', 막 받았으면 '수신'. */
function v3RadioTag(u,vn){if(u.nat!==vn||!radioOn())return '';const now=G.time||0;const e=radioPend(u);
  if(e){if(e.run)return '<em class="rd jm" title="재밍으로 무전이 끊겨 전령이 명령을 들고 가는 중">전령</em>';
    if(e.jam)return '<em class="rd jm" title="적 재밍: 무전 두절, 재송신 중">두절</em>';
    return `<em class="rd" title="무전으로 명령 전달 중">무전 ${Math.max(0,e.at-now).toFixed(1)}</em>`;}
  if(u._ack!=null&&now-u._ack<1.2)return '<u class="rk" title="명령 수신">수신</u>';
  if((u===UI.sel||(UI.group||[]).includes(u))&&radioCut(u))return '<em class="rd jm" title="적 재밍 반경 안: 새 명령이 잘 닿지 않음">재밍</em>';return '';}
function v3RadioDest(e,u){if(e.k==='move')return [e.a[0],e.a[1]];if(e.k==='atk'){const t=G.units.find(o=>o.id===e.a[0]);return t?[t.x,t.z]:null;}
  if(e.k==='bldg')return [e.a[1]+.5,e.a[0]+.5];return null;}
function v3RadioLines(L,LC,c){if(!radioOn()||!G.rq)return;const vn=G.viewer;
  for(const e of G.rq){if(e.nat!==vn)continue;c.set(e.jam?'#ff8a3d':'#f0c45a');
    for(const id of e.us){const u=G.units.find(o=>o.id===id);if(!u)continue;const d=v3RadioDest(e,u);const o=V3.uo.get(u.id);const x1=o?o.position.x:u.x,z1=o?o.position.z:u.z,y=.07;
      if(!d){for(let i=0;i<8;i++){const a1=i/8*6.283,a2=(i+.5)/8*6.283;L.push(x1+Math.cos(a1)*.2,y,z1+Math.sin(a1)*.2,x1+Math.cos(a2)*.2,y,z1+Math.sin(a2)*.2);LC.push(c.r,c.g,c.b,c.r,c.g,c.b);}continue;}

    const m=u.mor??80;P.push(`사기 ${m>=50?'양호':m>=20?'흔들림':'공황'}`);return P.join(' · ');}
